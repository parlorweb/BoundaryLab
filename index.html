  { id: 'OR-201', topicId: 'or1', difficulty: 3, type: 'single', prompt: 'The Oregon Donation Land Claim Act of 1850 granted how many acres to a married couple?', explanation: 'A married couple could claim 640 acres (one square mile) — 320 to the husband and 320 in the wife\'s name. Single men could claim 320 acres.', hint: 'Double the single man\'s allotment.', citation: 'Donation Land Claim Act of 1850', source: 'Gen-OR', examIds: ['or'], conceptIds: ['cor1b'], choices: [{ id: 'or201a', choiceKey: 'A', text: '640 acres', isCorrect: true }, { id: 'or201b', choiceKey: 'B', text: '320 acres', isCorrect: false }, { id: 'or201c', choiceKey: 'C', text: '160 acres', isCorrect: false }, { id: 'or201d', choiceKey: 'D', text: '1,280 acres', isCorrect: false }] },
  { id: 'OR-202', topicId: 'or1', difficulty: 3, type: 'single', prompt: 'DLC boundaries in Oregon often conflict with PLSS lines because:', explanation: 'DLCs were claimed and settled BEFORE the PLSS survey was extended into Oregon. Settlers established their claims using natural features and custom descriptions, which rarely aligned with the later rectangular survey.', hint: 'Which came first — the claims or the grid?', citation: 'BLM Manual 2009', source: 'Gen-OR', examIds: ['or'], conceptIds: ['cor1b','cor1c'], choices: [{ id: 'or202a', choiceKey: 'A', text: 'DLCs were established before the PLSS survey reached Oregon', isCorrect: true }, { id: 'or202b', choiceKey: 'B', text: 'The PLSS was intentionally designed to avoid DLCs', isCorrect: false }, { id: 'or202c', choiceKey: 'C', text: 'DLCs used metric measurements', isCorrect: false }, { id: 'or202d', choiceKey: 'D', text: 'Congress required DLCs to follow section lines', isCorrect: false }] },
  { id: 'OR-203', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'Under ORS 209.250, a survey must be filed with the county surveyor within how many days of setting a boundary monument?', explanation: 'ORS 209.250(1) requires filing within 45 days of establishing or reestablishing any boundary monument.', hint: 'Just over 6 weeks.', citation: 'ORS 209.250(1)', source: 'Gen-OR', examIds: ['or'], conceptIds: ['cor2b'], choices: [{ id: 'or203a', choiceKey: 'A', text: '45 days', isCorrect: true }, { id: 'or203b', choiceKey: 'B', text: '30 days', isCorrect: false }, { id: 'or203c', choiceKey: 'C', text: '90 days', isCorrect: false }, { id: 'or203d', choiceKey: 'D', text: '60 days', isCorrect: false }] },
  { id: 'OR-204', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Under ORS 92.060(1), the minimum initial point monument for a subdivision is:', explanation: 'ORS 92.060(1) specifies galvanized iron pipe at least ¾" ID, 30" long, OR iron rod at least ⅝" diameter, 30" long, with cap showing surveyor info.', hint: '30 inches long, with a cap.', citation: 'ORS 92.060(1)', source: 'Gen-OR', examIds: ['or'], conceptIds: ['cor2a'], choices: [{ id: 'or204a', choiceKey: 'A', text: 'Iron pipe ≥¾" ID × 30" or iron rod ≥⅝" × 30", with cap', isCorrect: true }, { id: 'or204b', choiceKey: 'B', text: 'Any iron pin at least 24" long', isCorrect: false }, { id: 'or204c', choiceKey: 'C', text: 'Concrete monument 4" × 4" × 24"', isCorrect: false }, { id: 'or204d', choiceKey: 'D', text: 'Rebar ½" × 18" with plastic cap', isCorrect: false }] },
  { id: 'OR-205', topicId: 'or4', difficulty: 3, type: 'single', prompt: 'Under Oregon law (ORS 105.620), adverse possession requires possession for at least:', explanation: 'Oregon requires 10 years continuous possession with an honest belief, held on an objectively reasonable basis, that the claimant is the owner.', hint: 'A decade of honest belief.', citation: 'ORS 105.620', source: 'Gen-OR', examIds: ['or'], conceptIds: ['cor4a'], choices: [{ id: 'or205a', choiceKey: 'A', text: '10 years with honest belief', isCorrect: true }, { id: 'or205b', choiceKey: 'B', text: '7 years with color of title', isCorrect: false }, { id: 'or205c', choiceKey: 'C', text: '20 years with hostile intent', isCorrect: false }, { id: 'or205d', choiceKey: 'D', text: '5 years with recorded deed', isCorrect: false }] },
  { id: 'OR-206', topicId: 'or4', difficulty: 4, type: 'single', prompt: 'What distinguishes Oregon\'s adverse possession law from most other states?', explanation: 'Oregon is one of very few states requiring "honest belief" — the claimant must genuinely believe they own the land, with an objectively reasonable basis for that belief. Most states allow hostile/intentional adverse possession.', hint: 'Oregon added a subjective requirement in 1989.', citation: 'ORS 105.620(1)(d)', source: 'Gen-OR', examIds: ['or'], conceptIds: ['cor4a','cor4b'], choices: [{ id: 'or206a', choiceKey: 'A', text: 'The "honest belief" requirement — claimant must genuinely believe they own the land', isCorrect: true }, { id: 'or206b', choiceKey: 'B', text: 'A shorter statutory period than other states', isCorrect: false }, { id: 'or206c', choiceKey: 'C', text: 'No requirement for continuous possession', isCorrect: false }, { id: 'or206d', choiceKey: 'D', text: 'Payment of property taxes is required', isCorrect: false }] },
  { id: 'OR-207', topicId: 'or4', difficulty: 3, type: 'single', prompt: 'Boundary by acquiescence in Oregon requires:', explanation: 'Boundary by acquiescence requires neighboring owners to accept and treat a line as the boundary for the statutory period (10 years in Oregon). Unlike adverse possession, no hostile intent or honest belief is required — just mutual acceptance.', hint: 'Both neighbors agree (or at least don\'t dispute) the line.', citation: 'Oregon case law', source: 'Gen-OR', examIds: ['ps','or'], conceptIds: ['cor4b'], choices: [{ id: 'or207a', choiceKey: 'A', text: 'Mutual acceptance of a boundary line for the statutory period', isCorrect: true }, { id: 'or207b', choiceKey: 'B', text: 'A written agreement between neighbors', isCorrect: false }, { id: 'or207c', choiceKey: 'C', text: 'Court-ordered boundary determination', isCorrect: false }, { id: 'or207d', choiceKey: 'D', text: 'Hostile occupation by one party', isCorrect: false }] },
  { id: 'OR-208', topicId: 'or3', difficulty: 3, type: 'single', prompt: 'The proper order of elements in a metes and bounds description is:', explanation: 'A proper legal description includes: caption (name/location), point of beginning (POB), courses and distances around the parcel, returning to POB, then the containing clause (area).', hint: 'Start with where, describe the path, end with how much.', citation: null, source: 'Gen-OR', examIds: ['ps','or'], conceptIds: ['cor3a'], choices: [{ id: 'or208a', choiceKey: 'A', text: 'Caption → POB → Courses & Distances → Containing clause', isCorrect: true }, { id: 'or208b', choiceKey: 'B', text: 'Containing clause → POB → Courses & Distances → Caption', isCorrect: false }, { id: 'or208c', choiceKey: 'C', text: 'POB → Caption → Containing clause → Courses', isCorrect: false }, { id: 'or208d', choiceKey: 'D', text: 'Courses → POB → Caption → Area', isCorrect: false }] },
  { id: 'OR-209', topicId: 'or3', difficulty: 4, type: 'single', prompt: 'When writing curve data in a legal description, which elements are typically required?', explanation: 'Complete curve data includes: radius, arc length, central (delta) angle, chord bearing, and chord distance. Tangent length may also be included but is redundant with the other elements.', hint: 'Five elements fully define a curve.', citation: null, source: 'Gen-OR', examIds: ['ps','or'], conceptIds: ['cor3b'], choices: [{ id: 'or209a', choiceKey: 'A', text: 'Radius, arc length, delta angle, chord bearing, and chord distance', isCorrect: true }, { id: 'or209b', choiceKey: 'B', text: 'Radius and chord bearing only', isCorrect: false }, { id: 'or209c', choiceKey: 'C', text: 'Arc length and tangent length only', isCorrect: false }, { id: 'or209d', choiceKey: 'D', text: 'Central angle and degree of curvature only', isCorrect: false }] },
  { id: 'OR-210', topicId: 'or5', difficulty: 3, type: 'single', prompt: 'The Oregon Coordinate Reference System (OCRS) was established by which legislation?', explanation: 'OCRS was created by Senate Bill 877 (2009) which authorized ODOT to establish and maintain low-distortion map projections for Oregon.', hint: 'Senate Bill from 2009.', citation: 'SB 877 (2009)', source: 'Gen-OR', examIds: ['or'], conceptIds: ['cor5a'], choices: [{ id: 'or210a', choiceKey: 'A', text: 'Senate Bill 877 (2009)', isCorrect: true }, { id: 'or210b', choiceKey: 'B', text: 'ORS 209.150', isCorrect: false }, { id: 'or210c', choiceKey: 'C', text: 'Executive Order 99-01', isCorrect: false }, { id: 'or210d', choiceKey: 'D', text: 'House Bill 2152 (2015)', isCorrect: false }] },
  { id: 'OR-211', topicId: 'or5', difficulty: 4, type: 'single', prompt: 'What is the primary advantage of OCRS zones over standard State Plane zones?', explanation: 'OCRS zones are designed with much smaller areas so the scale factor stays very close to 1.0 (low distortion). Standard State Plane zones cover larger areas and can have scale factors of 1:10,000 or worse, requiring grid-to-ground corrections.', hint: 'Scale factor close to 1.0 — no conversion needed.', citation: 'ODOT OCRS Handbook', source: 'Gen-OR', examIds: ['or'], conceptIds: ['cor5a','c30'], choices: [{ id: 'or211a', choiceKey: 'A', text: 'Much lower grid-to-ground distortion (scale factor near 1.0)', isCorrect: true }, { id: 'or211b', choiceKey: 'B', text: 'They use a different ellipsoid', isCorrect: false }, { id: 'or211c', choiceKey: 'C', text: 'They eliminate the need for GPS', isCorrect: false }, { id: 'or211d', choiceKey: 'D', text: 'They cover all of Oregon in a single zone', isCorrect: false }] },
  { id: 'OR-212', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Under ORS 672.005, the practice of land surveying includes:', explanation: 'ORS 672 defines land surveying as determining positions of points on the earth\'s surface, establishing property boundaries, platting, and preparing maps and descriptions for boundary determination.', hint: 'It\'s about positions, boundaries, and legal descriptions.', citation: 'ORS 672.005', source: 'Gen-OR', examIds: ['or'], conceptIds: ['cor2c'], choices: [{ id: 'or212a', choiceKey: 'A', text: 'Establishing property boundaries and preparing maps/descriptions', isCorrect: true }, { id: 'or212b', choiceKey: 'B', text: 'Only construction layout and staking', isCorrect: false }, { id: 'or212c', choiceKey: 'C', text: 'Only topographic mapping', isCorrect: false }, { id: 'or212d', choiceKey: 'D', text: 'Real estate appraisal and title search', isCorrect: false }] },
  { id: 'OR-213', topicId: 'or4', difficulty: 3, type: 'single', prompt: 'Accretion differs from avulsion in that accretion is:', explanation: 'Accretion is the gradual and imperceptible addition of land by natural water action. The boundary moves with the water. Avulsion is sudden (flood, earthquake) and the boundary does NOT move.', hint: 'Slow and imperceptible vs. sudden and dramatic.', citation: null, source: 'Gen-OR', examIds: ['ps','or'], conceptIds: ['cor4c'], choices: [{ id: 'or213a', choiceKey: 'A', text: 'A gradual, imperceptible change where the boundary follows the water', isCorrect: true }, { id: 'or213b', choiceKey: 'B', text: 'A sudden change caused by flood or earthquake', isCorrect: false }, { id: 'or213c', choiceKey: 'C', text: 'An intentional change made by the landowner', isCorrect: false }, { id: 'or213d', choiceKey: 'D', text: 'A court-ordered boundary relocation', isCorrect: false }] },

  { id: 'OR-301', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Under Oregon subdivision law, which statement best describes when a partition plat is required?', explanation: 'A partition plat is required when land is partitioned as defined by ORS 92.010 and must be surveyed and platted under ORS 92.050-.060 before recordation. Deeds alone do not replace statutory plat requirements. Tax lot map updates are administrative, not statutory substitutes. Lot count drives subdivision vs partition classification, but qualifying partition actions still require compliance.', hint: 'Start with definitions, then move to the platting sections.', citation: 'ORS 92.010; ORS 92.050; ORS 92.060', source: 'ORS-92', examIds: ['or'], conceptIds: ['cor2a', 'cor2d', 'c23'], choices: [{ id: 'or301a', choiceKey: 'A', text: 'A partition plat is optional if all parties consent in writing', isCorrect: false }, { id: 'or301b', choiceKey: 'B', text: 'A partition plat is required for partition actions governed by ORS 92 before recording resulting parcels', isCorrect: true }, { id: 'or301c', choiceKey: 'C', text: 'A partition plat is only required when a new public road is dedicated', isCorrect: false }, { id: 'or301d', choiceKey: 'D', text: 'A partition plat is never required when county GIS can depict the parcels', isCorrect: false }] },
  { id: 'OR-302', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'Which office is statutorily central to Oregon survey record maintenance and filing oversight at the county level?', explanation: 'County surveyor duties under ORS chapter 209 include maintaining survey records and related county surveying functions. Tax assessment mapping is different from survey record duties. OSBEELS licenses practitioners but does not maintain county archives. Circuit courts adjudicate disputes but do not perform routine filing.', hint: 'Think ORS 209 duties, not licensing or taxation.', citation: 'ORS 209.070; ORS 209.250', source: 'ORS-209', examIds: ['or'], conceptIds: ['cor2b', 'cor2d', 'c23'], choices: [{ id: 'or302a', choiceKey: 'A', text: 'County surveyor', isCorrect: true }, { id: 'or302b', choiceKey: 'B', text: 'County assessor only', isCorrect: false }, { id: 'or302c', choiceKey: 'C', text: 'OSBEELS directly', isCorrect: false }, { id: 'or302d', choiceKey: 'D', text: 'Circuit court clerk', isCorrect: false }] },
  { id: 'OR-303', topicId: 'or4', difficulty: 4, type: 'single', prompt: 'For an Oregon adverse possession claim under modern statute, which element is explicitly required?', explanation: 'ORS 105.620 requires open/notorious, exclusive, hostile, continuous possession for 10 years, plus honest belief of actual ownership at inception. 7 years is not the statutory period. Occasional permissive use fails hostility/continuity. Written color of title is not universally required.', hint: 'The Oregon statute is specific on duration and state of mind.', citation: 'ORS 105.620', source: 'ORS-105', examIds: ['or'], conceptIds: ['cor4a', 'c4', 'c14'], choices: [{ id: 'or303a', choiceKey: 'A', text: 'Continuous possession for at least 7 years', isCorrect: false }, { id: 'or303b', choiceKey: 'B', text: 'Continuous possession for at least 10 years with honest belief of actual ownership when possession began', isCorrect: true }, { id: 'or303c', choiceKey: 'C', text: 'Any intermittent use if neighbors do not object', isCorrect: false }, { id: 'or303d', choiceKey: 'D', text: 'Proof that claimant paid rent to record owner', isCorrect: false }] },
  { id: 'DG-304', topicId: 'or5', difficulty: 3, type: 'single', prompt: 'A survey report lists Oregon State Plane coordinates but does not identify datum/epoch. What is the best professional response?', explanation: 'Coordinate values are datum-dependent. A professional report should identify the governing datum/realization and epoch. Projection alone is insufficient. County location does not guarantee datum consistency. Instrument class does not remove datum disclosure requirements.', hint: 'State Plane numbers are meaningless without their reference frame.', citation: 'ORS 209.250', source: 'OCRS-Study', examIds: ['or'], conceptIds: ['cor5a', 'cor5b', 'c29', 'c30'], choices: [{ id: 'dg304a', choiceKey: 'A', text: 'Accept it; State Plane implies a single universal datum', isCorrect: false }, { id: 'dg304b', choiceKey: 'B', text: 'Require identification of datum/realization and epoch before relying on the coordinates', isCorrect: true }, { id: 'dg304c', choiceKey: 'C', text: 'Use county tax map coordinates as the legal datum substitute', isCorrect: false }, { id: 'dg304d', choiceKey: 'D', text: 'Ignore datum if GNSS equipment was survey-grade', isCorrect: false }] },
  { id: 'PLSS-305', topicId: 'or1', difficulty: 3, type: 'single', prompt: 'When original PLSS corner evidence is found and credible, what is the proper restoration priority?', explanation: 'Under BLM principles, original monumented evidence controls over proportionate calculations. Measurements are subordinate to original controlling evidence. GNSS precision does not supersede legal priority of original evidence. Record bearings alone do not outrank existent original corner evidence.', hint: 'Monuments first, math second.', citation: 'BLM Manual 2009, §6-4; §6-5', source: 'BLM-2009', examIds: ['fs','ps','or'], conceptIds: ['cor1a', 'cor1c', 'c23', 'c25', 'c7'], choices: [{ id: 'plss305a', choiceKey: 'A', text: 'Accept original corner evidence as controlling if authenticated', isCorrect: true }, { id: 'plss305b', choiceKey: 'B', text: 'Always apply double proportion before evaluating found evidence', isCorrect: false }, { id: 'plss305c', choiceKey: 'C', text: 'Replace all historic corners with GNSS-derived positions', isCorrect: false }, { id: 'plss305d', choiceKey: 'D', text: 'Use deed distance averages as first priority', isCorrect: false }] },
  { id: 'DLC-306', topicId: 'or1', difficulty: 4, type: 'single', prompt: 'A deed calls to a Donation Land Claim line and also gives a conflicting measured distance. Which boundary principle controls?', explanation: 'Calls to controlling monuments/recognized lines (including established claim boundaries) prevail over conflicting distance calls. Distance is lower dignity. Tax maps are not controlling legal instruments. Private intent cannot override legal interpretation of deed calls absent reformation.', hint: 'Apply dignity of calls.', citation: 'BLM Manual 2009, §5-20; ORS 93.310', source: 'DLC-Study', examIds: ['or'], conceptIds: ['cor1b', 'cor3c', 'c23', 'c14', 'c24'], choices: [{ id: 'dlc306a', choiceKey: 'A', text: 'Measured distance controls because it is numeric and objective', isCorrect: false }, { id: 'dlc306b', choiceKey: 'B', text: 'Tax lot map depiction controls if recently updated', isCorrect: false }, { id: 'dlc306c', choiceKey: 'C', text: 'The called-for claim line/monument controls before conflicting distance', isCorrect: true }, { id: 'dlc306d', choiceKey: 'D', text: 'Use whichever interpretation yields larger acreage', isCorrect: false }] },
  { id: 'PD-307', topicId: 'or3', difficulty: 3, type: 'single', prompt: 'Which curve description is minimally complete for a boundary that follows a circular arc?', explanation: 'A legally defensible curve call identifies direction and sufficient geometric elements (radius, arc length, often with central angle/chord data) to locate it unambiguously. "To a point" gives no geometry. Bearing-only lacks curvature definition. Area statement alone cannot fix boundary geometry.', hint: 'A curve needs geometry, not just a destination.', citation: 'ORS 93.310', source: 'PD-Guide', examIds: ['ps','or'], conceptIds: ['cor3a', 'cor3b', 'c23', 'c24'], choices: [{ id: 'pd307a', choiceKey: 'A', text: 'Thence along a curve to a point', isCorrect: false }, { id: 'pd307b', choiceKey: 'B', text: 'Thence along a 300.00-foot radius curve left, arc length 120.00 feet', isCorrect: true }, { id: 'pd307c', choiceKey: 'C', text: 'Thence northerly by curve', isCorrect: false }, { id: 'pd307d', choiceKey: 'D', text: 'Thence with roadway, containing 0.25 acres', isCorrect: false }] },
  { id: 'PD-308', topicId: 'or3', difficulty: 2, type: 'single', prompt: 'In a metes-and-bounds legal description, which component most directly establishes where the parcel begins?', explanation: 'The Point of Beginning (POB) establishes the starting location for the boundary traverse. Area is descriptive but not a controlling start location. Tax account identifiers are administrative. Owner name is not a geometric control element.', hint: 'Where does the traverse start?', citation: 'ORS 93.310', source: 'PD-Guide', examIds: ['ps','or'], conceptIds: ['cor3a', 'c23', 'c24'], choices: [{ id: 'pd308a', choiceKey: 'A', text: 'Point of Beginning call tied to identifiable evidence', isCorrect: true }, { id: 'pd308b', choiceKey: 'B', text: 'Statement of gross acreage only', isCorrect: false }, { id: 'pd308c', choiceKey: 'C', text: 'County tax lot number', isCorrect: false }, { id: 'pd308d', choiceKey: 'D', text: 'Current grantor mailing address', isCorrect: false }] },
  { id: 'UT-309', topicId: 'or4', difficulty: 4, type: 'multi', prompt: 'Select all that are generally associated with proving a prescriptive easement claim in Oregon.', explanation: 'Prescriptive easement requires open/notorious use, adverse/hostile use under claim of right, and continuity for the prescriptive period. Permission defeats adversity. A recorded deed grant is express easement creation, not unwritten transfer.', hint: 'Think adverse use elements, not permission or express grant.', citation: 'Thompson v. Scott, 270 Or 542 (1974)', source: 'Case-Law', examIds: ['ps','or'], conceptIds: ['cor4b', 'cor4d', 'c4', 'c14'], choices: [{ id: 'ut309a', choiceKey: 'A', text: 'Open and notorious use', isCorrect: true }, { id: 'ut309b', choiceKey: 'B', text: 'Use by express permission from owner', isCorrect: false }, { id: 'ut309c', choiceKey: 'C', text: 'Continuous adverse use for the statutory period', isCorrect: true }, { id: 'ut309d', choiceKey: 'D', text: 'Recorded easement deed from owner', isCorrect: false }] },
  { id: 'DG-310', topicId: 'or5', difficulty: 3, type: 'single', prompt: 'A project combines elevations from two surveys. One references NAVD88 and the other leaves vertical datum unstated. What is the best professional action?', explanation: 'Vertical data should not be merged when datum control is unknown. The unstated dataset must be resolved to a known vertical datum before integration. Unit matching alone does not resolve datum mismatch. County location does not guarantee shared vertical reference. Averaging incompatible elevations creates systematic error.', hint: 'Unstated vertical datum is a red flag.', citation: 'ORS 209.250', source: 'OCRS-Study', examIds: ['or'], conceptIds: ['cor5b', 'cor5c', 'c29', 'c30', 'c23'], choices: [{ id: 'dg310a', choiceKey: 'A', text: 'Combine directly if both are in feet', isCorrect: false }, { id: 'dg310b', choiceKey: 'B', text: 'Treat unstated vertical datum as NAVD88 by default', isCorrect: false }, { id: 'dg310c', choiceKey: 'C', text: 'Pause integration and resolve the unstated vertical datum before use', isCorrect: true }, { id: 'dg310d', choiceKey: 'D', text: 'Average both elevation sets to neutralize datum error', isCorrect: false }] },

  { id: 'MATH-301', topicId: 't1', difficulty: 3, type: 'single', prompt: 'A 60 ft × 120 ft rectangular lot has one corner replaced by a curve with radius 20 ft and central angle 90°. The lot area (sq ft) is most nearly:', explanation: 'Full rectangle = 60×120 = 7,200. Remove the 20×20 square corner = 7,200−400 = 6,800. Add back the quarter-circle = π(20²)/4 = 314.16. Total = 6,800 + 314 ≈ 7,114.', hint: 'Subtract the square corner, add back the quarter circle.', citation: null, source: 'NCEES-Style', examIds: ['fs','ps'], conceptIds: ['c16','c9'], choices: [{ id: 'ma301a', choiceKey: 'A', text: '6,886', isCorrect: false }, { id: 'ma301b', choiceKey: 'B', text: '7,200', isCorrect: false }, { id: 'ma301c', choiceKey: 'C', text: '7,114', isCorrect: true }, { id: 'ma301d', choiceKey: 'D', text: '6,872', isCorrect: false }] },
  { id: 'MATH-302', topicId: 't1', difficulty: 4, type: 'single', prompt: 'A triangular parcel has angles 50°, 55°, and 75°. Side c (opposite 75°) must create a 1-acre parcel. Using Area = c²·sin(A)·sin(B) / (2·sin(C)), what is c (ft)?', explanation: '43,560 = c²·sin50·sin55 / (2·sin75). c² = 2·43,560·sin75 / (sin50·sin55) = 2·43,560·0.9659 / (0.7660·0.8192) = 84,164.7 / 0.6276 = 134,104. c = √134,104 ≈ 366.2 ft.', hint: 'Rearrange the triangle area formula solving for c.', citation: null, source: 'NCEES-Style', examIds: ['fs','ps'], conceptIds: ['c1','c16'], choices: [{ id: 'ma302a', choiceKey: 'A', text: '299.96 ft', isCorrect: false }, { id: 'ma302b', choiceKey: 'B', text: '352.84 ft', isCorrect: false }, { id: 'ma302c', choiceKey: 'C', text: '358.73 ft', isCorrect: false }, { id: 'ma302d', choiceKey: 'D', text: '366.20 ft', isCorrect: true }] },
  { id: 'MATH-303', topicId: 't1', difficulty: 3, type: 'single', prompt: 'The equation of a circle centered at (5, −2) with radius 4 is:', explanation: '(x−h)² + (y−k)² = r². With h=5, k=−2, r=4: (x−5)² + (y+2)² = 16, or (x−5)² + (y+2)² − 16 = 0.', hint: 'Remember (y−(−2)) = (y+2), and r² = 16 not 4.', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c17'], choices: [{ id: 'ma303a', choiceKey: 'A', text: '(x−5)² + (y−2)² − 4 = 0', isCorrect: false }, { id: 'ma303b', choiceKey: 'B', text: '(x+5)² + (y+2)² − 4 = 0', isCorrect: false }, { id: 'ma303c', choiceKey: 'C', text: '(x−5)² + (y+2)² − 16 = 0', isCorrect: true }, { id: 'ma303d', choiceKey: 'D', text: '(x−5)² + (y+2)² + 16 = 0', isCorrect: false }] },
  { id: 'ERR-301', topicId: 't3', difficulty: 3, type: 'single', prompt: 'A rectangular lot measures 120.00 ± 0.04 ft by 144.00 ± 0.05 ft. The area error is most nearly:', explanation: 'Error propagation for products: σ_A = √((144×0.04)² + (120×0.05)²) = √(5.76² + 6.0²) = √(33.18 + 36.0) = √69.18 ≈ 8.3 sq ft.', hint: 'For multiplication: multiply each side by the OTHER side\'s error, then RSS.', citation: null, source: 'NCEES-Style', examIds: ['fs','ps'], conceptIds: ['c12','c6'], choices: [{ id: 'er301a', choiceKey: 'A', text: '±4.7 sq ft', isCorrect: false }, { id: 'er301b', choiceKey: 'B', text: '±8.3 sq ft', isCorrect: true }, { id: 'er301c', choiceKey: 'C', text: '±49.7 sq ft', isCorrect: false }, { id: 'er301d', choiceKey: 'D', text: '±87 sq ft', isCorrect: false }] },
  { id: 'ERR-302', topicId: 't3', difficulty: 4, type: 'single', prompt: 'An angle is measured 12 times. The standard deviation of a single observation is ±3.05". The standard deviation of the mean is most nearly:', explanation: 'σ_mean = σ/√n = 3.05/√12 = 3.05/3.464 = ±0.88". Round to ±0.9".', hint: 'Divide σ by the square root of n.', citation: null, source: 'NCEES-Style', examIds: ['fs','ps'], conceptIds: ['c6'], choices: [{ id: 'er302a', choiceKey: 'A', text: '±0.9"', isCorrect: true }, { id: 'er302b', choiceKey: 'B', text: '±1.5"', isCorrect: false }, { id: 'er302c', choiceKey: 'C', text: '±2.8"', isCorrect: false }, { id: 'er302d', choiceKey: 'D', text: '±3.3"', isCorrect: false }] },
  { id: 'FS-301', topicId: 't6', difficulty: 3, type: 'single', prompt: 'BM A elevation is 644.00 ft. BS = 8.76, FS = 3.21. If the rod at the FS point is tilted 10° from vertical, the correct elevation of BM B is:', explanation: 'HI = 644.00 + 8.76 = 652.76. True FS reading = 3.21 × cos10° = 3.21 × 0.9848 = 3.16. BM B = 652.76 − 3.16 = 649.60 ft.', hint: 'A tilted rod reads too high. Multiply FS by cosine of tilt angle.', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c28','c21'], choices: [{ id: 'fs301a', choiceKey: 'A', text: '638.40 ft', isCorrect: false }, { id: 'fs301b', choiceKey: 'B', text: '649.50 ft', isCorrect: false }, { id: 'fs301c', choiceKey: 'C', text: '649.55 ft', isCorrect: false }, { id: 'fs301d', choiceKey: 'D', text: '649.60 ft', isCorrect: true }] },
  { id: 'FS-302', topicId: 't6', difficulty: 3, type: 'single', prompt: 'Two brass monuments have a known separation of 99.96 ft. A tape reads 99.99 ft between them. What is the true tape length between the 0 and 100 marks?', explanation: 'By proportion: 99.96/99.99 = x/100.00. x = 100.00 × 99.96/99.99 = 99.97 ft. The tape is slightly long.', hint: 'Set up a proportion: known/measured = x/nominal.', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c27','c21'], choices: [{ id: 'fs302a', choiceKey: 'A', text: '99.95 ft', isCorrect: false }, { id: 'fs302b', choiceKey: 'B', text: '99.97 ft', isCorrect: true }, { id: 'fs302c', choiceKey: 'C', text: '100.03 ft', isCorrect: false }, { id: 'fs302d', choiceKey: 'D', text: 'Cannot be determined', isCorrect: false }] },
  { id: 'FS-303', topicId: 't6', difficulty: 4, type: 'single', prompt: 'Direct and reverse zenith angles read D=36°12\'18" and R=323°47\'36". The index error is:', explanation: 'D+R should = 360°. Sum = 36°12\'18" + 323°47\'36" = 359°59\'54". Short by 6". Index error = 6"/2 = 3" per reading. Adjusted D = 36°12\'21".', hint: 'D+R should equal exactly 360°. The difference split equally is the index error.', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c27','c21'], choices: [{ id: 'fs303a', choiceKey: 'A', text: '3" (readings are 6" short of 360°)', isCorrect: true }, { id: 'fs303b', choiceKey: 'B', text: '6" (full discrepancy)', isCorrect: false }, { id: 'fs303c', choiceKey: 'C', text: '0" (no error)', isCorrect: false }, { id: 'fs303d', choiceKey: 'D', text: '12" (doubled discrepancy)', isCorrect: false }] },
  { id: 'FS-304', topicId: 't6', difficulty: 4, type: 'single', prompt: 'Leveling uphill with BS=200 ft and FS=150 ft, line of sight is inclined upward 0.012 ft per 100 ft. Over 20 setups, the measured ΔElev is +50.035 ft. The corrected ΔElev is:', explanation: 'Per setup: BS error = 200×0.012/100 = 0.024. FS error = 150×0.012/100 = 0.018. Net per setup = 0.024−0.018 = 0.006 too much. Total = 20×0.006 = 0.12. Corrected = 50.035−0.12 = 49.915.', hint: 'Upward-inclined sight adds too much to both BS and FS, but unequally.', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c28','c13','c21'], choices: [{ id: 'fs304a', choiceKey: 'A', text: '49.915 ft', isCorrect: true }, { id: 'fs304b', choiceKey: 'B', text: '50.023 ft', isCorrect: false }, { id: 'fs304c', choiceKey: 'C', text: '50.029 ft', isCorrect: false }, { id: 'fs304d', choiceKey: 'D', text: '50.155 ft', isCorrect: false }] },
  { id: 'FS-305', topicId: 't6', difficulty: 3, type: 'single', prompt: 'An EDM measures 1 mile at an elevation of 1 mile (5,280 ft). Earth\'s radius R = 20,906,000 ft. The sea-level distance is most nearly:', explanation: 'Sea level factor = R/(R+H) = 20,906,000/20,911,280 = 0.999747. SLD = 5,280 × 0.999747 = 5,278.67 ft.', hint: 'Multiply measured distance by R/(R+H).', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c27','c13'], choices: [{ id: 'fs305a', choiceKey: 'A', text: '5,270.02 ft', isCorrect: false }, { id: 'fs305b', choiceKey: 'B', text: '5,278.67 ft', isCorrect: true }, { id: 'fs305c', choiceKey: 'C', text: '5,280.00 ft', isCorrect: false }, { id: 'fs305d', choiceKey: 'D', text: '5,281.33 ft', isCorrect: false }] },
  { id: 'MATH-304', topicId: 't1', difficulty: 2, type: 'single', prompt: 'Which object subtends the greatest angle at your eye?', explanation: 'Compare size/distance ratios: Tree 18ft/300ft=0.060. House 12ft/180ft=0.067. Coin 0.5in/10in=0.050. Moon 2170mi/240000mi=0.009. The house has the greatest ratio.', hint: 'Divide each object\'s size by its distance. Largest ratio = largest angle.', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c17'], choices: [{ id: 'ma304a', choiceKey: 'A', text: 'A tree 18 ft tall at 100 yards', isCorrect: false }, { id: 'ma304b', choiceKey: 'B', text: 'A house 12 ft tall at 180 ft', isCorrect: true }, { id: 'ma304c', choiceKey: 'C', text: 'A ½-inch coin at 10 inches', isCorrect: false }, { id: 'ma304d', choiceKey: 'D', text: 'The 2,170-mile moon at 240,000 miles', isCorrect: false }] },
  { id: 'MATH-305', topicId: 't1', difficulty: 2, type: 'single', prompt: 'The sum of the exterior angles of an 8-sided polygon is:', explanation: 'Sum of exterior angles = (n+2)×180 = (8+2)×180 = 1,800°. Alternatively, exterior angle = 360° for convex + interior sum.', hint: 'Formula: (n+2) × 180°.', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c17'], choices: [{ id: 'ma305a', choiceKey: 'A', text: '1,800°', isCorrect: true }, { id: 'ma305b', choiceKey: 'B', text: '1,440°', isCorrect: false }, { id: 'ma305c', choiceKey: 'C', text: '1,080°', isCorrect: false }, { id: 'ma305d', choiceKey: 'D', text: '360°', isCorrect: false }] },
  { id: 'MATH-306', topicId: 't1', difficulty: 3, type: 'single', prompt: 'If A = B*C + D/C^2, where B=2, C=0.5, D=127, what is A?', explanation: 'Following order of operations: B*C = 2×0.5 = 1. C^2 = 0.25. D/C^2 = 127/0.25 = 508. A = 1 + 508 = 509.', hint: 'Exponent first, then multiply and divide left to right, then add.', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c17'], choices: [{ id: 'ma306a', choiceKey: 'A', text: '509', isCorrect: true }, { id: 'ma306b', choiceKey: 'B', text: '512', isCorrect: false }, { id: 'ma306c', choiceKey: 'C', text: '130,050', isCorrect: false }, { id: 'ma306d', choiceKey: 'D', text: '299,081', isCorrect: false }] },
  { id: 'T-301', topicId: 't2', difficulty: 3, type: 'single', prompt: 'From Point A (100.00N, 100.00E) to Point E (−11.92N, 609.50E), the distance and bearing are most nearly:', explanation: 'ΔN = −11.92−100 = −111.92. ΔE = 609.50−100 = 509.50. Dist = √(111.92²+509.50²) = √(12526+259550) = √272076 ≈ 521.6 ft. Bearing angle = atan(509.50/111.92) = atan(4.553) = 77°37\'. Direction: S (negative N) and E (positive E) = S 77°37\' E.', hint: 'Compute ΔN and ΔE, then use inverse tangent.', citation: null, source: 'NCEES-Style', examIds: ['fs','ps'], conceptIds: ['c11','c2','c19'], choices: [{ id: 't301a', choiceKey: 'A', text: '517.06 ft, S 80°06\' E', isCorrect: false }, { id: 't301b', choiceKey: 'B', text: '521.65 ft, S 12°23\' E', isCorrect: false }, { id: 't301c', choiceKey: 'C', text: '521.65 ft, S 77°37\' E', isCorrect: true }, { id: 't301d', choiceKey: 'D', text: '517.06 ft, S 09°54\' E', isCorrect: false }] },
  { id: 'FS-306', topicId: 't6', difficulty: 3, type: 'single', prompt: 'A sewer invert at MH1 is found at 1228.69 instead of design 1228.47. MH2 invert = 1229.27 at Sta 2+47.55. Grade stake elevation at Sta 1+25 is 1235.06. The cut to flowline is most nearly:', explanation: 'Rise = 1229.27−1228.69 = 0.58 over 247.55 ft. Grade = 0.58/247.55 = 0.002343 ft/ft. At Sta 1+25 (125 ft from MH1): invert = 1228.69 + 125×0.002343 = 1228.69 + 0.29 = 1228.98. Cut = 1235.06 − 1228.98 = 6.08 ft.', hint: 'Interpolate the revised grade at the stake station.', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c28','c33'], choices: [{ id: 'fs306a', choiceKey: 'A', text: '5.98 ft', isCorrect: false }, { id: 'fs306b', choiceKey: 'B', text: '6.08 ft', isCorrect: true }, { id: 'fs306c', choiceKey: 'C', text: '6.18 ft', isCorrect: false }, { id: 'fs306d', choiceKey: 'D', text: '6.25 ft', isCorrect: false }] },
  { id: 'MATH-307', topicId: 't1', difficulty: 2, type: 'single', prompt: 'A thermometer reads 3°F too high and shows 46°F. The correct temperature in °C is most nearly:', explanation: 'Correct F = 46−3 = 43°F. C = 5/9 × (43−32) = 5/9 × 11 = 55/9 ≈ 6.1°C.', hint: 'First correct the reading, then convert.', citation: null, source: 'NCEES-Style', examIds: ['fs'], conceptIds: ['c17','c21'], choices: [{ id: 'ma307a', choiceKey: 'A', text: '6.1°C', isCorrect: true }, { id: 'ma307b', choiceKey: 'B', text: '7.8°C', isCorrect: false }, { id: 'ma307c', choiceKey: 'C', text: '9.4°C', isCorrect: false }, { id: 'ma307d', choiceKey: 'D', text: '25.2°C', isCorrect: false }] },
  // ═══════════════════════════════════════════════════════════════
  // FS — Boundary Law from Brown's study guide
  // ═══════════════════════════════════════════════════════════════
  { id: 'BL-301', topicId: 't4', difficulty: 3, type: 'single', prompt: 'According to boundary law principles, "what boundaries are" vs "where boundaries are" is a distinction between:', explanation: 'What boundaries ARE is a question of law (legal interpretation of deeds, statutes, rights). Where boundaries ARE is a question of fact (physical location determined by survey evidence).', hint: 'One is decided by judges, the other by surveyors.', citation: null, source: 'Browns-BCC', examIds: ['fs','ps'], conceptIds: ['c23','c14'], choices: [{ id: 'bl301a', choiceKey: 'A', text: 'Law (what) vs. fact (where)', isCorrect: true }, { id: 'bl301b', choiceKey: 'B', text: 'Federal law vs. state law', isCorrect: false }, { id: 'bl301c', choiceKey: 'C', text: 'Original survey vs. retracement', isCorrect: false }, { id: 'bl301d', choiceKey: 'D', text: 'Written description vs. oral testimony', isCorrect: false }] },
  { id: 'BL-302', topicId: 't4', difficulty: 2, type: 'single', prompt: 'In real property law, "fee simple absolute" means:', explanation: 'Fee simple absolute is the highest form of ownership. "Fee" = inheritable, "simple" = no restrictions on heirs, "absolute" = no conditions or time limits. It can continue forever.', hint: 'The most complete form of property ownership.', citation: null, source: 'Browns-BCC', examIds: ['fs','ps'], conceptIds: ['c14'], choices: [{ id: 'bl302a', choiceKey: 'A', text: 'The highest and most complete form of property ownership, with no conditions or time limits', isCorrect: true }, { id: 'bl302b', choiceKey: 'B', text: 'An ownership that expires after a fixed term', isCorrect: false }, { id: 'bl302c', choiceKey: 'C', text: 'An easement that runs with the land', isCorrect: false }, { id: 'bl302d', choiceKey: 'D', text: 'A leasehold interest that can be inherited', isCorrect: false }] },
  { id: 'BL-303', topicId: 't4', difficulty: 3, type: 'single', prompt: 'An easement that permits one person to do something on another\'s land is called:', explanation: 'An affirmative (positive) easement permits the holder to perform acts on another\'s land (e.g., cross it, run utilities). The land benefiting is the dominant estate; the burdened land is the servient estate.', hint: 'Think "permission to do" vs "prohibition from doing."', citation: null, source: 'Browns-BCC', examIds: ['fs','ps'], conceptIds: ['c4','c14'], choices: [{ id: 'bl303a', choiceKey: 'A', text: 'An affirmative (positive) easement', isCorrect: true }, { id: 'bl303b', choiceKey: 'B', text: 'A negative easement', isCorrect: false }, { id: 'bl303c', choiceKey: 'C', text: 'A license', isCorrect: false }, { id: 'bl303d', choiceKey: 'D', text: 'A covenant', isCorrect: false }] },
  { id: 'BL-304', topicId: 't4', difficulty: 3, type: 'single', prompt: 'How many original boundary surveys can exist for a single parcel?', explanation: 'Law provides for only ONE original survey and description of a parcel. All subsequent surveys are retracements that follow the footsteps of the original surveyor. The original survey controls.', hint: 'Think about the principle of retracement.', citation: null, source: 'Browns-BCC', examIds: ['fs','ps','or'], conceptIds: ['c23','c14'], choices: [{ id: 'bl304a', choiceKey: 'A', text: 'Only one — all subsequent surveys are retracements', isCorrect: true }, { id: 'bl304b', choiceKey: 'B', text: 'As many as there are recorded deeds', isCorrect: false }, { id: 'bl304c', choiceKey: 'C', text: 'Two — one by the original surveyor and one by the county', isCorrect: false }, { id: 'bl304d', choiceKey: 'D', text: 'There is no limit', isCorrect: false }] },
  { id: 'BL-305', topicId: 't4', difficulty: 2, type: 'single', prompt: 'Title is best defined as:', explanation: 'Title is the means or vehicle (usually documents like deeds) by which a person acquires an estate or interest in real property. It is not the property itself, nor is it synonymous with a boundary.', hint: 'It\'s the document/vehicle, not the land itself.', citation: null, source: 'Browns-BCC', examIds: ['fs','ps'], conceptIds: ['c14'], choices: [{ id: 'bl305a', choiceKey: 'A', text: 'The means or documents by which one acquires an estate in land', isCorrect: true }, { id: 'bl305b', choiceKey: 'B', text: 'The physical boundary of a parcel', isCorrect: false }, { id: 'bl305c', choiceKey: 'C', text: 'A survey monument set at a corner', isCorrect: false }, { id: 'bl305d', choiceKey: 'D', text: 'The appraised value of real property', isCorrect: false }] },
];

const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const randPick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const roundTo = (n, d) => parseFloat(n.toFixed(d));
const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
const makeChoices = (correct, distractors, idBase) => {
  const keys = ['A','B','C','D'];
  const all = shuffle([
    { text: String(correct), isCorrect: true },
    ...distractors.map(d => ({ text: String(d), isCorrect: false }))
  ]);
  return all.map((c, i) => ({ id: idBase + i, choiceKey: keys[i], ...c }));
};

const generateFromTemplate = (tpl) => {
  const { prompt, explanation, hint, choices } = tpl.generate();
  return {
    id: tpl.id + '-' + uid().slice(0, 8),
    topicId: tpl.topicId, difficulty: tpl.difficulty, type: tpl.type,
    prompt, explanation, hint, source: tpl.source, conceptIds: tpl.conceptIds, choices,
    _templateId: tpl.id, _generated: true
  };
};

const store = {
  _cache: {},
  async get(key, fallback) {
    if (this._cache.hasOwnProperty(key)) return this._cache[key];
    try {
      const r = localStorage.getItem("bl_" + key);
      if (r != null) { const val = JSON.parse(r); this._cache[key] = val; return val; }
      this._cache[key] = fallback; return fallback;
    } catch (e) { this._cache[key] = fallback; return fallback; }
  },
  async set(key, val) { this._cache[key] = val; try { localStorage.setItem("bl_" + key, JSON.stringify(val)); } catch(e) {} },
  invalidate(key) { delete this._cache[key]; try { localStorage.removeItem("bl_" + key); } catch(e) {} }
};

const MathReferencePage = () => {
  const [open,setOpen]=useState(null);

  const sections=[
    { id:'trig', title:'Trigonometry Fundamentals', icon:'📐', items:[
      { title:'SOH-CAH-TOA', content:'sin(A) = Opposite / Hypotenuse\ncos(A) = Adjacent / Hypotenuse\ntan(A) = Opposite / Adjacent\n\nThese only work for RIGHT triangles. For oblique (non-right) triangles, use Law of Sines or Cosines.' },
      { title:'Law of Sines — when to use', content:'Use when you have: AAS, ASA, or SSA (ambiguous case)\n\nFormula: a/sinA = b/sinB = c/sinC\n\nExample: Given A=40°, a=120, b=150 → sinB = b·sinA/a = 150·sin40°/120 = 0.8035 → B = 53.5°\n\n🖩 HP 35s: Run Triangle solver (XEQ T), enter known side-angle pairs.' },
      { title:'Law of Cosines — when to use', content:'Use when you have: SAS or SSS\n\nFormula: c² = a² + b² − 2ab·cosC\n\nExample: a=100, b=80, C=60° → c² = 10000+6400−2(100)(80)(0.5) = 8400 → c = 91.65\n\nAlso: cosC = (a²+b²−c²) / 2ab (to find an angle from three sides)\n\n🖩 HP 35s: Triangle solver handles this — enter SSS or SAS case.' },
      { title:'When to use which?', content:'DECISION TREE:\n\n1. Is it a RIGHT triangle? → Use SOH-CAH-TOA\n2. Do you know TWO ANGLES + one SIDE? → Law of Sines (AAS/ASA)\n3. Do you know TWO SIDES + INCLUDED angle? → Law of Cosines (SAS)\n4. Do you know THREE SIDES? → Law of Cosines (SSS) to find angles\n5. Do you know TWO SIDES + NON-included angle? → Law of Sines (SSA) — watch for ambiguous case!' },
    ]},
    { id:'area', title:'Area Methods', icon:'📏', items:[
      { title:'Heron\'s Formula (SSS)', content:'When you know all 3 sides:\n\ns = (a+b+c)/2\nArea = √(s(s−a)(s−b)(s−c))\n\nExample: a=150, b=200, c=250 → s=300\nArea = √(300×150×100×50) = √225,000,000 = 15,000 sq units' },
      { title:'SAS Triangle Area', content:'When you know 2 sides and the included angle:\n\nArea = ½ · a · b · sinC\n\nExample: a=200, b=300, C=45° → Area = ½(200)(300)(0.7071) = 21,213 sq ft' },
      { title:'Two-angle Area (from NCEES exam)', content:'When you know 2 angles + 1 side and need area:\n\nArea = c²·sinA·sinB / (2·sinC)\n\nUseful for: "Create a 1-acre parcel" problems where you solve for the unknown side.' },
      { title:'Coordinate Area (Shoelace)', content:'For a polygon with coordinates:\n\n2A = Σ(Xᵢ·Yᵢ₊₁ − Xᵢ₊₁·Yᵢ)\n\n🖩 HP 35s: Area by Coordinates program — enter each point\'s N,E coordinates, get area in sq ft and acres.' },
      { title:'Lot with curved corner', content:'Rectangle with one corner replaced by a curve (radius R, central angle Δ):\n\nArea = (length × width) − R² + (πR²·Δ/360)\n\nFor 90° curve: Area = L×W − R² + πR²/4\n\nExample: 60×120 lot, R=20, Δ=90° → 7200 − 400 + 314 = 7,114 sq ft' },
    ]},
    { id:'bearing', title:'Bearings & Azimuths', icon:'🧭', items:[
      { title:'Bearing → Azimuth', content:'NE quadrant: Az = bearing angle\nSE quadrant: Az = 180° − bearing angle\nSW quadrant: Az = 180° + bearing angle\nNW quadrant: Az = 360° − bearing angle\n\nExample: S 45° W → 180+45 = 225°\nExample: N 72° E → 72°' },
      { title:'Azimuth → Bearing', content:'0-90°: N (Az)° E\n90-180°: S (180−Az)° E\n180-270°: S (Az−180)° W\n270-360°: N (360−Az)° W\n\nExample: 225° → 225−180 = S 45° W\nExample: 315° → 360−315 = N 45° W' },
      { title:'Lat & Dep from Bearing', content:'Latitude (N/S) = distance × cos(bearing angle)\nDeparture (E/W) = distance × sin(bearing angle)\n\nSign: N=+, S=−, E=+, W=−\n\nExample: S 30° E, dist=400 → Lat = −400·cos30° = −346.4, Dep = +400·sin30° = +200.0\n\n🖩 HP 35s: Traverse program computes these automatically from bearing+distance.' },
      { title:'Inverse (Coords → Bearing+Dist)', content:'Given two points (N₁,E₁) and (N₂,E₂):\n\nΔN = N₂−N₁, ΔE = E₂−E₁\nDist = √(ΔN²+ΔE²)\nAngle = atan(|ΔE|/|ΔN|)\nQuadrant from signs of ΔN and ΔE\n\n🖩 HP 35s: Inverse program — enter two point coordinates, get bearing and distance.' },
    ]},
    { id:'curves', title:'Horizontal Curves', icon:'🔄', items:[
      { title:'Curve Elements', content:'R = Radius\nΔ = Central (delta) angle\nT = Tangent = R·tan(Δ/2)\nL = Arc length = R·Δ·π/180\nLC = Long chord = 2R·sin(Δ/2)\nE = External = R(1/cos(Δ/2) − 1)\nM = Middle ordinate = R(1 − cos(Δ/2))\n\nKnow any 2 → compute all others.\n\n🖩 HP 35s: Curve program — enter R and Δ, get all elements.' },
      { title:'Degree of Curvature', content:'Arc definition (highway): D = 5729.578/R\nChord definition (railroad): D = 2·arcsin(50/R)\n\nFS exam usually uses arc definition.' },
      { title:'Curve Description in Legal Descriptions', content:'Minimum data for a legally defensible curve:\n• Direction (left or right)\n• Radius\n• Arc length\n• Central angle (delta)\n• Chord bearing\n• Chord distance\n\nExample: "along a 300.00-foot radius curve to the left, an arc distance of 120.00 feet, the chord of which bears N 45°30\'00" E, 118.47 feet"' },
    ]},
    { id:'error', title:'Error Analysis', icon:'⚠️', items:[
      { title:'Standard Deviation of the Mean', content:'σ_mean = σ / √n\n\nExample: σ = ±3.05", n = 12 measurements\nσ_mean = 3.05/√12 = 3.05/3.464 = ±0.88"' },
      { title:'Error Propagation — Addition', content:'For sum/difference of independent measurements:\n\nσ_total = √(σ₁² + σ₂² + ... + σₙ²)\n\nExample: 500±0.03 + 300±0.02 → σ = √(0.03²+0.02²) = ±0.036' },
      { title:'Error Propagation — Area', content:'For area of rectangle (a±σₐ) × (b±σᵦ):\n\nσ_Area = √((b·σₐ)² + (a·σᵦ)²)\n\nExample: 120±0.04 × 144±0.05 → σ = √((144·0.04)²+(120·0.05)²) = ±8.3 sq ft' },
      { title:'Relative Precision', content:'Precision = closure error / total perimeter\n\nExample: 0.15 ft closure over 1,500 ft → 0.15/1500 = 1:10,000\n\nMinimum standards vary: 1:10,000 (first order), 1:5,000 (second order)' },
    ]},
    { id:'leveling', title:'Leveling', icon:'📊', items:[
      { title:'Basic Differential Leveling', content:'HI = Elev_BM + BS\nElev_TP = HI − FS\n\nAlways: add backsight, subtract foresight.\n\nTilted rod correction: true FS = reading × cos(tilt angle)' },
      { title:'Collimation Correction', content:'If line of sight is inclined (e.g., 0.012 ft per 100 ft):\n\nBS error = BS_dist × rate\nFS error = FS_dist × rate\nNet error per setup = BS_error − FS_error\nTotal correction = net × number_of_setups\n\nBalancing BS and FS distances eliminates this error.' },
      { title:'Sea Level Distance', content:'SLD = measured_distance × R/(R+H)\n\nR = earth radius (20,906,000 ft)\nH = elevation above sea level\n\nExample: 5,280 ft at 5,280 ft elevation → 5,280 × 20,906,000/20,911,280 = 5,278.67 ft' },
