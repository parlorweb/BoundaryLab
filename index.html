  { id: 'DS2-06', topicId: 't2', difficulty: 3, type: 'single', prompt: 'Traverse total length 2,750 ft, LEC = 0.55 ft. Approximate precision ratio?', explanation: '2750/0.55 = 5000 → 1:5,000.', hint: 'Precision = 1:(perimeter/LEC).', source: 'DrillSet2', conceptIds: ['c18'], choices: [{ id: 'ds206a', choiceKey: 'A', text: '1:500', isCorrect: false }, { id: 'ds206b', choiceKey: 'B', text: '1:1,200', isCorrect: false }, { id: 'ds206c', choiceKey: 'C', text: '1:5,000', isCorrect: true }, { id: 'ds206d', choiceKey: 'D', text: '1:27,500', isCorrect: false }] },
  { id: 'DS2-07', topicId: 't2', difficulty: 4, type: 'single', prompt: 'Bowditch: course = 420 ft, total traverse = 2,100 ft, total ΣLat misclosure = +0.50 ft. Correction to this course\'s latitude?', explanation: 'C = −(+0.50) × (420/2100) = −0.10 ft.', hint: 'Bowditch lat correction = −(ΣLat error) × (course length / total length).', source: 'DrillSet2', conceptIds: ['c3'], choices: [{ id: 'ds207a', choiceKey: 'A', text: '+0.10 ft', isCorrect: false }, { id: 'ds207b', choiceKey: 'B', text: '−0.10 ft', isCorrect: true }, { id: 'ds207c', choiceKey: 'C', text: '+0.25 ft', isCorrect: false }, { id: 'ds207d', choiceKey: 'D', text: '−0.25 ft', isCorrect: false }] },
  { id: 'DS2-08', topicId: 't2', difficulty: 4, type: 'single', prompt: 'Same course (420 ft of 2,100 ft total). If ΣDep misclosure = −0.30 ft, Bowditch correction to departure?', explanation: 'C = −(−0.30) × (420/2100) = +0.06 ft.', hint: 'Same formula, applied to departure.', source: 'DrillSet2', conceptIds: ['c3'], choices: [{ id: 'ds208a', choiceKey: 'A', text: '+0.06 ft', isCorrect: true }, { id: 'ds208b', choiceKey: 'B', text: '−0.06 ft', isCorrect: false }, { id: 'ds208c', choiceKey: 'C', text: '+0.30 ft', isCorrect: false }, { id: 'ds208d', choiceKey: 'D', text: '−0.30 ft', isCorrect: false }] },
  { id: 'DS2-09', topicId: 't2', difficulty: 4, type: 'single', prompt: 'If ΣLat = −0.80 ft and ΣDep = +0.60 ft, the closing line from computed endpoint to the true start lies in which quadrant?', explanation: 'Endpoint is SE of start. Closing line reverses: +0.80(N), −0.60(W) = NW.', hint: 'The closing line is the reverse of the error vector.', source: 'DrillSet2', conceptIds: ['c2', 'c10'], choices: [{ id: 'ds209a', choiceKey: 'A', text: 'NE', isCorrect: false }, { id: 'ds209b', choiceKey: 'B', text: 'SE', isCorrect: false }, { id: 'ds209c', choiceKey: 'C', text: 'SW', isCorrect: false }, { id: 'ds209d', choiceKey: 'D', text: 'NW', isCorrect: true }] },
  { id: 'DS2-10', topicId: 't2', difficulty: 3, type: 'single', prompt: 'Which statement about traverse adjustment is most correct?', explanation: 'Bowditch distributes lat & dep corrections proportional to course length; used when angles and distances are of comparable quality.', hint: 'Compass Rule = Bowditch.', source: 'DrillSet2', conceptIds: ['c3'], choices: [{ id: 'ds210a', choiceKey: 'A', text: 'Bowditch is preferred when angles dominate and distances are rough', isCorrect: false }, { id: 'ds210b', choiceKey: 'B', text: 'Transit rule distributes corrections proportional to line length', isCorrect: false }, { id: 'ds210c', choiceKey: 'C', text: 'Bowditch distributes lat & dep corrections by line length; used when angles and distances are comparable quality', isCorrect: true }, { id: 'ds210d', choiceKey: 'D', text: 'Neither method conserves total correction to zero', isCorrect: false }] },
  // ── eq-drill-set-3 (Vertical Curves/Earthwork) ────────────────
  { id: 'DS3-01', topicId: 't1', difficulty: 3, type: 'single', prompt: 'Road rises from Elev. 412.30 ft at Sta. 10+00 to 430.80 ft at Sta. 15+50. Grade (%)?', explanation: 'Rise = 18.50 ft, Run = 550 ft. Grade = 18.50/550 × 100 = 3.36%.', hint: 'Grade = (rise/run) × 100.', source: 'DrillSet3', conceptIds: ['c17'], choices: [{ id: 'ds301a', choiceKey: 'A', text: '2.36%', isCorrect: false }, { id: 'ds301b', choiceKey: 'B', text: '3.36%', isCorrect: true }, { id: 'ds301c', choiceKey: 'C', text: '4.12%', isCorrect: false }, { id: 'ds301d', choiceKey: 'D', text: '5.50%', isCorrect: false }] },
  { id: 'DS3-02', topicId: 't1', difficulty: 2, type: 'single', prompt: 'A tangent has +1.80% grade. Elev. at Sta. 22+00 is 255.40 ft. Elev. at Sta. 25+50?', explanation: 'Distance = 350 ft. Rise = 0.018 × 350 = 6.30 ft. Elev = 255.40 + 6.30 = 261.70 ft.', hint: 'Multiply grade (as decimal) by distance.', source: 'DrillSet3', conceptIds: ['c17'], choices: [{ id: 'ds302a', choiceKey: 'A', text: '249.10 ft', isCorrect: false }, { id: 'ds302b', choiceKey: 'B', text: '253.50 ft', isCorrect: false }, { id: 'ds302c', choiceKey: 'C', text: '261.70 ft', isCorrect: true }, { id: 'ds302d', choiceKey: 'D', text: '267.00 ft', isCorrect: false }] },
  { id: 'DS3-03', topicId: 't1', difficulty: 4, type: 'single', prompt: 'Parabolic vertical curve: +3.0% to −1.5%, L = 600 ft. What are A and K?', explanation: 'A = g₂ − g₁ = −1.5 − 3.0 = −4.5%. |A| = 4.5. K = 600/4.5 = 133.3.', hint: 'A = g₂ − g₁; K = L/|A|.', source: 'DrillSet3', conceptIds: ['c17'], choices: [{ id: 'ds303a', choiceKey: 'A', text: 'A=1.5, K=400', isCorrect: false }, { id: 'ds303b', choiceKey: 'B', text: 'A=4.5, K=133.3', isCorrect: true }, { id: 'ds303c', choiceKey: 'C', text: 'A=−4.5, K=600', isCorrect: false }, { id: 'ds303d', choiceKey: 'D', text: 'A=3.0, K=200', isCorrect: false }] },
  { id: 'DS3-04', topicId: 't1', difficulty: 3, type: 'single', prompt: 'Vertical curve: PVI at Sta. 48+20, L = 500 ft. What are PVC and PVT stations?', explanation: 'PVC = 48+20 − 2+50 = 45+70. PVT = 48+20 + 2+50 = 50+70.', hint: 'PVC = PVI − L/2; PVT = PVI + L/2.', source: 'DrillSet3', conceptIds: ['c17'], choices: [{ id: 'ds304a', choiceKey: 'A', text: 'PVC 45+70, PVT 50+70', isCorrect: true }, { id: 'ds304b', choiceKey: 'B', text: 'PVC 46+20, PVT 50+20', isCorrect: false }, { id: 'ds304c', choiceKey: 'C', text: 'PVC 45+20, PVT 51+20', isCorrect: false }, { id: 'ds304d', choiceKey: 'D', text: 'PVC 43+20, PVT 53+20', isCorrect: false }] },
  { id: 'DS3-05', topicId: 't1', difficulty: 4, type: 'single', prompt: 'g₁=+2.4%, g₂=−1.6%, L=400 ft, PVI at Sta. 60+00, Elev. PVI = 512.00 ft. Find Elev. at PVC.', explanation: 'PVC is 200 ft before PVI on g₁ tangent. E_PVC = 512.00 − 0.024×200 = 507.20 ft.', hint: 'PVC elevation = PVI elev − g₁ × (L/2).', source: 'DrillSet3', conceptIds: ['c17'], choices: [{ id: 'ds305a', choiceKey: 'A', text: '507.20 ft', isCorrect: true }, { id: 'ds305b', choiceKey: 'B', text: '516.80 ft', isCorrect: false }, { id: 'ds305c', choiceKey: 'C', text: '512.00 ft', isCorrect: false }, { id: 'ds305d', choiceKey: 'D', text: '509.60 ft', isCorrect: false }] },
  { id: 'DS3-06', topicId: 't1', difficulty: 5, type: 'single', prompt: 'Same curve as above. What is Elev. at Sta. 61+00? Use E(x) = E_PVC + g₁x + Ax²/(2L).', explanation: 'PVC at 58+00, x=300. A=−0.040. E = 507.20 + 0.024(300) + (−0.040)(90000)/800 = 507.20 + 7.20 − 4.50 = 509.90 ft.', hint: 'x is distance from PVC; A = g₂ − g₁ in decimal.', source: 'DrillSet3', conceptIds: ['c17'], choices: [{ id: 'ds306a', choiceKey: 'A', text: '509.90 ft', isCorrect: true }, { id: 'ds306b', choiceKey: 'B', text: '510.70 ft', isCorrect: false }, { id: 'ds306c', choiceKey: 'C', text: '511.70 ft', isCorrect: false }, { id: 'ds306d', choiceKey: 'D', text: '512.70 ft', isCorrect: false }] },
  { id: 'DS3-07', topicId: 't1', difficulty: 2, type: 'single', prompt: 'Pavement has 2.0% cross slope over a 12-ft lane. What is the drop from crown to edge?', explanation: 'Drop = 0.02 × 12 = 0.24 ft.', hint: 'Drop = slope × width.', source: 'DrillSet3', conceptIds: ['c17'], choices: [{ id: 'ds307a', choiceKey: 'A', text: '0.12 ft', isCorrect: false }, { id: 'ds307b', choiceKey: 'B', text: '0.24 ft', isCorrect: true }, { id: 'ds307c', choiceKey: 'C', text: '0.48 ft', isCorrect: false }, { id: 'ds307d', choiceKey: 'D', text: '1.20 ft', isCorrect: false }] },
  { id: 'DS3-08', topicId: 't1', difficulty: 3, type: 'single', prompt: 'Two stations 100 ft apart. Fill areas: 220 sf and 340 sf. Estimate fill volume (average end area).', explanation: 'Avg = (220+340)/2 = 280 sf. Volume = 280 × 100 = 28,000 cf ÷ 27 ≈ 1,037 cy.', hint: 'V = (A₁+A₂)/2 × L; divide by 27 for cubic yards.', source: 'DrillSet3', conceptIds: ['c17'], choices: [{ id: 'ds308a', choiceKey: 'A', text: '1,037 cy', isCorrect: true }, { id: 'ds308b', choiceKey: 'B', text: '1,037 cf', isCorrect: false }, { id: 'ds308c', choiceKey: 'C', text: '2,074 cy', isCorrect: false }, { id: 'ds308d', choiceKey: 'D', text: '560 cy', isCorrect: false }] },
  { id: 'DS3-09', topicId: 't1', difficulty: 3, type: 'single', prompt: 'Fill side slopes 2H:1V, centerline fill depth 6 ft, roadbed top width 32 ft. Cross-sectional fill area (level ground)?', explanation: 'Side run = 2×6 = 12 ft each. Bottom = 32+12+12 = 56 ft. Trap area = (32+56)/2 × 6 = 264 sf.', hint: 'Bottom width = top + 2×(slope ratio × depth).', source: 'DrillSet3', conceptIds: ['c16'], choices: [{ id: 'ds309a', choiceKey: 'A', text: '192 sf', isCorrect: false }, { id: 'ds309b', choiceKey: 'B', text: '264 sf', isCorrect: true }, { id: 'ds309c', choiceKey: 'C', text: '336 sf', isCorrect: false }, { id: 'ds309d', choiceKey: 'D', text: '408 sf', isCorrect: false }] },
  { id: 'DS3-10', topicId: 't1', difficulty: 3, type: 'single', prompt: 'Project needs 9,000 compacted cy. Borrow shrink = 10%. How many borrow cy needed?', explanation: 'Compacted = 90% of borrow. 9,000/0.90 = 10,000 bcy.', hint: 'V_borrow = V_compacted / (1 − shrink).', source: 'DrillSet3', conceptIds: ['c17'], choices: [{ id: 'ds310a', choiceKey: 'A', text: '8,100 bcy', isCorrect: false }, { id: 'ds310b', choiceKey: 'B', text: '9,900 bcy', isCorrect: false }, { id: 'ds310c', choiceKey: 'C', text: '10,000 bcy', isCorrect: true }, { id: 'ds310d', choiceKey: 'D', text: '11,100 bcy', isCorrect: false }] },
  // ── ors-oar-kit-01 (Oregon State-Specific) ────────────────────
  { id: 'OR-01', topicId: 'or2', difficulty: 1, type: 'single', prompt: 'Which two primary sources are authoritative for Oregon licensure and surveying practice?', explanation: 'ORS (Oregon Revised Statutes) and OAR (Oregon Administrative Rules) are the two authoritative sources.', hint: 'Think statutes and rules.', citation: 'ORS 672; OAR 820', source: 'ORS-OAR-Kit1', conceptIds: ['cor2c'], choices: [{ id: 'or01a', choiceKey: 'A', text: 'OSHA regulations and county surveyor preferences', isCorrect: false }, { id: 'or01b', choiceKey: 'B', text: 'ORS (statutes) and OAR (administrative rules)', isCorrect: true }, { id: 'or01c', choiceKey: 'C', text: 'USGS quad maps and FEMA flood maps', isCorrect: false }, { id: 'or01d', choiceKey: 'D', text: 'AIA contract documents and the IBC', isCorrect: false }] },
  { id: 'OR-02', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'What OAR chapter number governs the practice of land surveying in Oregon?', explanation: 'OAR Chapter 820 contains the rules governing engineering and land surveying practice, administered by OSBEELS.', hint: 'Think OSBEELS rules chapter.', citation: 'OAR 820', source: 'ORS-OAR-Kit1', conceptIds: ['cor2c'], choices: [{ id: 'or02a', choiceKey: 'A', text: 'OAR 820', isCorrect: true }, { id: 'or02b', choiceKey: 'B', text: 'OAR 672', isCorrect: false }, { id: 'or02c', choiceKey: 'C', text: 'OAR 209', isCorrect: false }, { id: 'or02d', choiceKey: 'D', text: 'OAR 390', isCorrect: false }] },
  { id: 'OR-03', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'On an open-book Oregon exam, what is the best way to use your ORS/OAR printouts?', explanation: 'Use them to confirm wording and citations for answers you already roughly know — retrieval speed is key.', hint: 'Retrieval speed is what matters on exam day.', citation: 'OSBEELS Exam Syllabus', source: 'ORS-OAR-Kit1', conceptIds: ['cor2d'], choices: [{ id: 'or03a', choiceKey: 'A', text: 'Read them for the first time during the exam', isCorrect: false }, { id: 'or03b', choiceKey: 'B', text: 'Only rely on memory', isCorrect: false }, { id: 'or03c', choiceKey: 'C', text: 'Confirm wording and citations when you already know where to look', isCorrect: true }, { id: 'or03d', choiceKey: 'D', text: 'Write full-page explanations for every answer', isCorrect: false }] },
  { id: 'OR-04', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'Which is the correct Oregon source for official OAR text?', explanation: 'The Oregon Secretary of State website (secure.sos.state.or.us) hosts the official OAR database.', hint: 'Official government source.', citation: 'secure.sos.state.or.us/oard', source: 'ORS-OAR-Kit1', conceptIds: ['cor2d'], choices: [{ id: 'or04a', choiceKey: 'A', text: 'Wikipedia', isCorrect: false }, { id: 'or04b', choiceKey: 'B', text: 'secure.sos.state.or.us (OR Secretary of State)', isCorrect: true }, { id: 'or04c', choiceKey: 'C', text: 'Random PDF on a forum', isCorrect: false }, { id: 'or04d', choiceKey: 'D', text: 'A screenshot someone texted you', isCorrect: false }] },
  { id: 'OR-05', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'Why do ORS/OAR questions feel unfair to many Oregon exam takers?', explanation: 'They require exact statutory wording and there is limited time to find the right section.', hint: 'It is about retrieval speed under pressure.', citation: 'OSBEELS Exam Syllabus', source: 'ORS-OAR-Kit1', conceptIds: ['cor2d'], choices: [{ id: 'or05a', choiceKey: 'A', text: 'They are trick questions with no correct answers', isCorrect: false }, { id: 'or05b', choiceKey: 'B', text: 'They require exact wording with limited lookup time', isCorrect: true }, { id: 'or05c', choiceKey: 'C', text: 'They are all math problems', isCorrect: false }, { id: 'or05d', choiceKey: 'D', text: 'They are all federal PLSS questions', isCorrect: false }] },
  { id: 'OR-06', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'PLSO recommends bringing printed statutes/rules matching the exam syllabus. What is the most important attached instruction?', explanation: 'Statutes and rules change — always bring the CURRENT edition.', hint: 'Laws change. Outdated printouts can cost you points.', citation: 'plso.org/PLS-Exam-Study', source: 'ORS-OAR-Kit1', conceptIds: ['cor2d'], choices: [{ id: 'or06a', choiceKey: 'A', text: 'Make sure the version is CURRENT', isCorrect: true }, { id: 'or06b', choiceKey: 'B', text: 'Highlight everything', isCorrect: false }, { id: 'or06c', choiceKey: 'C', text: 'Bind in leather', isCorrect: false }, { id: 'or06d', choiceKey: 'D', text: 'Remove tables of contents', isCorrect: false }] },
  { id: 'OR-07', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'You see a question asking for a specific ORS/OAR reference but don\'t remember the number. Fastest move?', explanation: 'Use the OAR 820 table of contents as your search engine — scan headings for the relevant topic.', hint: 'Use the table of contents as your search engine.', citation: 'OAR 820 TOC', source: 'ORS-OAR-Kit1', conceptIds: ['cor2d'], choices: [{ id: 'or07a', choiceKey: 'A', text: 'Panic', isCorrect: false }, { id: 'or07b', choiceKey: 'B', text: 'Jump to OAR 820 chapter index/TOC and scan headings', isCorrect: true }, { id: 'or07c', choiceKey: 'C', text: 'Search Google on the exam computer', isCorrect: false }, { id: 'or07d', choiceKey: 'D', text: 'Skip the question permanently', isCorrect: false }] },
  { id: 'OR-08', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'Where does OSBEELS host the official Oregon-Specific Land Surveying exam syllabus?', explanation: 'The syllabus PDF is available on the Oregon.gov OSBEELS licensing exam information page.', hint: 'Official .gov source.', citation: 'oregon.gov/osbeels/obtaining/pages/licensing-exam-information', source: 'ORS-OAR-Kit1', conceptIds: ['cor2d'], choices: [{ id: 'or08a', choiceKey: 'A', text: 'The Oregon.gov OSBEELS site', isCorrect: true }, { id: 'or08b', choiceKey: 'B', text: 'Reddit', isCorrect: false }, { id: 'or08c', choiceKey: 'C', text: 'A private Discord', isCorrect: false }, { id: 'or08d', choiceKey: 'D', text: 'Your county intranet', isCorrect: false }] },
  // ── ORS 92 Citation Drills (from seeds) ────────────────────────
  { id: 'OR-09', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Under ORS 92, what is a "lawfully established unit of land"?', explanation: 'A lot or parcel created pursuant to ORS 92.010–92.192, or created in compliance with applicable planning/zoning/subdivision ordinances, or by deed if no such ordinances existed.', hint: 'Check the definitions section of ORS 92.', citation: 'ORS 92.010(3)(a)', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or09a', choiceKey: 'A', text: 'Any piece of land with a tax account number', isCorrect: false }, { id: 'or09b', choiceKey: 'B', text: 'A lot/parcel created under ORS 92.010–92.192 or in compliance with applicable ordinances', isCorrect: true }, { id: 'or09c', choiceKey: 'C', text: 'Any land described in a deed regardless of ordinances', isCorrect: false }, { id: 'or09d', choiceKey: 'D', text: 'Land that has been surveyed by a PLS within the last 10 years', isCorrect: false }] },
  { id: 'OR-10', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Which ORS section requires city or county approval before creating a street or road for subdividing land?', explanation: 'ORS 92.014 prohibits creating a street/road for subdivision/partition without city or county approval.', hint: 'Early in ORS 92 — before the plat requirements.', citation: 'ORS 92.014', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or10a', choiceKey: 'A', text: 'ORS 92.050', isCorrect: false }, { id: 'or10b', choiceKey: 'B', text: 'ORS 92.014', isCorrect: true }, { id: 'or10c', choiceKey: 'C', text: 'ORS 92.100', isCorrect: false }, { id: 'or10d', choiceKey: 'D', text: 'ORS 209.250', isCorrect: false }] },
  { id: 'OR-11', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Before a tentative plan is approved, what does ORS 92.016 restrict?', explanation: 'ORS 92.016 prohibits the sale of or negotiation to sell any lot or parcel in the subdivision/partition before the tentative plan is approved.', hint: 'Think about what a developer cannot do before approval.', citation: 'ORS 92.016', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or11a', choiceKey: 'A', text: 'Filing the survey with the county', isCorrect: false }, { id: 'or11b', choiceKey: 'B', text: 'Sale of or negotiation to sell lots/parcels', isCorrect: true }, { id: 'or11c', choiceKey: 'C', text: 'Placing monuments on the ground', isCorrect: false }, { id: 'or11d', choiceKey: 'D', text: 'Hiring a registered surveyor', isCorrect: false }] },
  { id: 'OR-12', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'ORS 92.025 prohibits what activity prior to the recording of a plat?', explanation: 'No person may sell any lot or parcel in a subdivision or partition until the plat has been recorded.', hint: 'Similar to 92.016 but the trigger is recording, not just approval.', citation: 'ORS 92.025', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or12a', choiceKey: 'A', text: 'Surveying the property', isCorrect: false }, { id: 'or12b', choiceKey: 'B', text: 'Sale of a lot or parcel before the plat is recorded', isCorrect: true }, { id: 'or12c', choiceKey: 'C', text: 'Grading the road', isCorrect: false }, { id: 'or12d', choiceKey: 'D', text: 'Applying for a building permit', isCorrect: false }] },
  { id: 'OR-13', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Which ORS section covers the application and tentative plan process for subdivisions and partitions?', explanation: 'ORS 92.040 governs the application for approval of a subdivision or partition.', hint: 'After the prohibition sections, look for the application process.', citation: 'ORS 92.040', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or13a', choiceKey: 'A', text: 'ORS 92.040', isCorrect: true }, { id: 'or13b', choiceKey: 'B', text: 'ORS 92.070', isCorrect: false }, { id: 'or13c', choiceKey: 'C', text: 'ORS 92.120', isCorrect: false }, { id: 'or13d', choiceKey: 'D', text: 'ORS 92.025', isCorrect: false }] },
  { id: 'OR-14', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Under ORS 92.050, what accuracy standard must a subdivision/partition survey achieve?', explanation: 'Measurements must be accurate to within 1/10 of a foot or 1/10,000 of the distance shown, whichever is greater.', hint: 'Two-part tolerance: absolute and relative.', citation: 'ORS 92.050(2)', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or14a', choiceKey: 'A', text: '1/100 ft or 1/1,000 of distance', isCorrect: false }, { id: 'or14b', choiceKey: 'B', text: '1/10 ft or 1/10,000 of distance, whichever is greater', isCorrect: true }, { id: 'or14c', choiceKey: 'C', text: '1/100 ft or 1/100,000 of distance', isCorrect: false }, { id: 'or14d', choiceKey: 'D', text: 'There is no statutory accuracy standard', isCorrect: false }] },
  { id: 'OR-15', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Under ORS 92.060, what must mark the initial point (point of beginning) of a plat?', explanation: 'The initial point must be on the exterior boundary and marked with galvanized iron pipe (≥¾" ID, 30" long) or iron/steel rod (≥⅝" least dimension, 30" long).', hint: 'Think about monument materials and minimum dimensions.', citation: 'ORS 92.060(1)', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or15a', choiceKey: 'A', text: 'A wooden stake with flagging', isCorrect: false }, { id: 'or15b', choiceKey: 'B', text: 'Galvanized iron pipe (≥¾" ID, 30" long) or iron/steel rod (≥⅝", 30" long)', isCorrect: true }, { id: 'or15c', choiceKey: 'C', text: 'Any durable monument the surveyor chooses', isCorrect: false }, { id: 'or15d', choiceKey: 'D', text: 'A brass disk set in concrete', isCorrect: false }] },
  { id: 'OR-16', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'What must the surveyor\'s certificate on a plat certify per ORS 92.070?', explanation: 'That the surveyor has correctly surveyed and marked with proper monuments the land as represented, placed the initial point monument per ORS 92.060, and accurately described the tract by metes and bounds.', hint: 'Three things: surveyed correctly, monuments set, tract described.', citation: 'ORS 92.070(1)', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or16a', choiceKey: 'A', text: 'Only that the plat is drawn to scale', isCorrect: false }, { id: 'or16b', choiceKey: 'B', text: 'That the land was correctly surveyed, properly monumented, and the tract accurately described', isCorrect: true }, { id: 'or16c', choiceKey: 'C', text: 'That all property owners have been notified', isCorrect: false }, { id: 'or16d', choiceKey: 'D', text: 'That environmental review has been completed', isCorrect: false }] },
  { id: 'OR-17', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Under ORS 92.075, what instrument is required to subdivide or partition property?', explanation: 'A "declaration" — the instrument by which the subdivision or partition plat is created — must be filed.', hint: 'The "declaration" is defined in ORS 92.010(2).', citation: 'ORS 92.075', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or17a', choiceKey: 'A', text: 'A warranty deed', isCorrect: false }, { id: 'or17b', choiceKey: 'B', text: 'A declaration', isCorrect: true }, { id: 'or17c', choiceKey: 'C', text: 'A title insurance policy', isCorrect: false }, { id: 'or17d', choiceKey: 'D', text: 'A quit-claim deed', isCorrect: false }] },
  { id: 'OR-18', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'Which ORS section governs preparation of the plat itself?', explanation: 'ORS 92.080 covers plat preparation requirements.', hint: 'Follows the declaration (ORS 92.075) section.', citation: 'ORS 92.080', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or18a', choiceKey: 'A', text: 'ORS 92.080', isCorrect: true }, { id: 'or18b', choiceKey: 'B', text: 'ORS 92.050', isCorrect: false }, { id: 'or18c', choiceKey: 'C', text: 'ORS 92.120', isCorrect: false }, { id: 'or18d', choiceKey: 'D', text: 'ORS 209.250', isCorrect: false }] },
  { id: 'OR-19', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Under ORS 92.100, who must approve a subdivision or partition plat before it can be recorded?', explanation: 'The city or county surveyor must approve the plat, then the county assessor and governing body.', hint: 'Multiple approvals required — surveyor first.', citation: 'ORS 92.100', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or19a', choiceKey: 'A', text: 'Only the property owner', isCorrect: false }, { id: 'or19b', choiceKey: 'B', text: 'City/county surveyor, county assessor, and governing body', isCorrect: true }, { id: 'or19c', choiceKey: 'C', text: 'Only OSBEELS', isCorrect: false }, { id: 'or19d', choiceKey: 'D', text: 'The state land board', isCorrect: false }] },
  { id: 'OR-20', topicId: 'or2', difficulty: 2, type: 'single', prompt: 'Which ORS section addresses the recording of plats with the county clerk?', explanation: 'ORS 92.120 governs recording requirements for plats.', hint: 'The last step in the plat process — recording.', citation: 'ORS 92.120', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or20a', choiceKey: 'A', text: 'ORS 92.120', isCorrect: true }, { id: 'or20b', choiceKey: 'B', text: 'ORS 92.080', isCorrect: false }, { id: 'or20c', choiceKey: 'C', text: 'ORS 92.060', isCorrect: false }, { id: 'or20d', choiceKey: 'D', text: 'ORS 92.014', isCorrect: false }] },
  { id: 'OR-21', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Under ORS 209.250, within how many days must a surveyor file a survey map with the county surveyor after establishing a boundary monument?', explanation: 'A surveyor must submit a permanent map to the county surveyor within 45 days of establishing or reestablishing a boundary monument.', hint: 'Less than two months.', citation: 'ORS 209.250(1)', source: 'ORS-209', conceptIds: ['cor2b'], choices: [{ id: 'or21a', choiceKey: 'A', text: '30 days', isCorrect: false }, { id: 'or21b', choiceKey: 'B', text: '45 days', isCorrect: true }, { id: 'or21c', choiceKey: 'C', text: '60 days', isCorrect: false }, { id: 'or21d', choiceKey: 'D', text: '90 days', isCorrect: false }] },
  { id: 'OR-22', topicId: 'or2', difficulty: 3, type: 'single', prompt: 'Per ORS 92.060(6), must partition monuments be set before or after the plat is recorded?', explanation: 'All monuments on the exterior boundary and all parcel corner monuments of partitions must be set BEFORE the partition plat is offered for recording.', hint: 'Partitions are stricter than subdivisions on this point.', citation: 'ORS 92.060(6)', source: 'ORS-92-Seeds', conceptIds: ['cor2a'], choices: [{ id: 'or22a', choiceKey: 'A', text: 'Before — all exterior and parcel corners must be set before recording', isCorrect: true }, { id: 'or22b', choiceKey: 'B', text: 'After — they can be set within 1 year of recording', isCorrect: false }, { id: 'or22c', choiceKey: 'C', text: 'Only exterior corners must be set; interior can be deferred', isCorrect: false }, { id: 'or22d', choiceKey: 'D', text: 'No monuments are required for partitions', isCorrect: false }] },
  // ── PLSS Practice (converted from BLM Manual 2009 open-ended) ─
  { id: 'PLSS-01', topicId: 'or1', difficulty: 3, type: 'single', prompt: 'What legal effect does monumentation of an original survey corner have, even if technical errors later surface?', explanation: 'Original monuments remain fixed in law; courts prioritize evidence of original positions over later-discovered technical errors.', hint: 'Think about the finality of original surveys.', source: 'PLSS-Manual2009', conceptIds: ['cor1a', 'c15'], choices: [{ id: 'plss01a', choiceKey: 'A', text: 'The corner must be resurveyed and corrected', isCorrect: false }, { id: 'plss01b', choiceKey: 'B', text: 'The corner remains fixed in law regardless of technical errors', isCorrect: true }, { id: 'plss01c', choiceKey: 'C', text: 'The corner is void and must be abandoned', isCorrect: false }, { id: 'plss01d', choiceKey: 'D', text: 'Only GPS coordinates determine the correct position', isCorrect: false }] },
  { id: 'PLSS-02', topicId: 'or1', difficulty: 3, type: 'single', prompt: 'A lost corner lacks sufficient evidence to fix its original position. How must it be reestablished?', explanation: 'Lost corners must be reestablished via proportionate measurement tied to known controlling corners.', hint: 'BLM Manual Chapter 7.', source: 'PLSS-Manual2009', conceptIds: ['c15'], choices: [{ id: 'plss02a', choiceKey: 'A', text: 'By GPS observation at the record coordinates', isCorrect: false }, { id: 'plss02b', choiceKey: 'B', text: 'By proportionate measurement from known controlling corners', isCorrect: true }, { id: 'plss02c', choiceKey: 'C', text: 'By the nearest property owner\'s testimony', isCorrect: false }, { id: 'plss02d', choiceKey: 'D', text: 'By placing a new monument at any convenient location', isCorrect: false }] },
  { id: 'PLSS-03', topicId: 'or1', difficulty: 3, type: 'single', prompt: 'Why are water boundaries called "ambulatory"?', explanation: 'Ownership follows dynamic OHWM or mean high tide, which shifts as the water body changes.', hint: 'Think about what happens when a river moves.', source: 'PLSS-Manual2009', conceptIds: ['c24'], choices: [{ id: 'plss03a', choiceKey: 'A', text: 'Because they are always fixed by meander lines', isCorrect: false }, { id: 'plss03b', choiceKey: 'B', text: 'Because ownership follows the moving ordinary high water mark', isCorrect: true }, { id: 'plss03c', choiceKey: 'C', text: 'Because they are always straight lines', isCorrect: false }, { id: 'plss03d', choiceKey: 'D', text: 'Because only federal agencies can survey them', isCorrect: false }] },
  { id: 'PLSS-04', topicId: 'or1', difficulty: 4, type: 'single', prompt: 'Why can a protraction diagram NOT stand in for an official survey?', explanation: 'Protraction diagrams are paper plans extending the rectangular scheme without field monumentation — they depict intended layout only with no on-the-ground evidence.', hint: 'No monuments = no official survey.', source: 'PLSS-Manual2009', conceptIds: ['cor1c'], choices: [{ id: 'plss04a', choiceKey: 'A', text: 'They are not drawn to scale', isCorrect: false }, { id: 'plss04b', choiceKey: 'B', text: 'They lack field monumentation and represent intended layout only', isCorrect: true }, { id: 'plss04c', choiceKey: 'C', text: 'They are only used in Alaska', isCorrect: false }, { id: 'plss04d', choiceKey: 'D', text: 'They always contain errors', isCorrect: false }] },
  // ── Oregon Item 3: Property Descriptions (20%) ────────────────
  { id: 'PD-01', topicId: 'or3', difficulty: 2, type: 'single', prompt: 'A proper Oregon legal description begins with what element before any courses and distances?', explanation: 'A legal description must start with a caption — a statement identifying the parcel by its relationship to a section, township, range, and county.', hint: 'Pro Tip: Don\'t forget the caption.', citation: 'Oregon Deed Drafting Standards', source: 'PropertyDesc', conceptIds: ['cor3a'], choices: [{ id: 'pd01a', choiceKey: 'A', text: 'The area in acres', isCorrect: false }, { id: 'pd01b', choiceKey: 'B', text: 'A caption identifying the section, township, range, and county', isCorrect: true }, { id: 'pd01c', choiceKey: 'C', text: 'The surveyor\'s license number', isCorrect: false }, { id: 'pd01d', choiceKey: 'D', text: 'The bearing to true north', isCorrect: false }] },
  { id: 'PD-02', topicId: 'or3', difficulty: 2, type: 'single', prompt: 'What is the standard closing clause at the end of a metes-and-bounds legal description?', explanation: 'After the courses return to the POB, the description ends with "Containing ___ acres, more or less" (or similar area statement).', hint: 'Think about what comes after you return to the POB.', citation: 'Oregon Deed Drafting Standards', source: 'PropertyDesc', conceptIds: ['cor3a'], choices: [{ id: 'pd02a', choiceKey: 'A', text: '"Signed and sealed this date"', isCorrect: false }, { id: 'pd02b', choiceKey: 'B', text: '"Containing ___ acres, more or less"', isCorrect: true }, { id: 'pd02c', choiceKey: 'C', text: '"Subject to all existing easements"', isCorrect: false }, { id: 'pd02d', choiceKey: 'D', text: '"End of description"', isCorrect: false }] },
  { id: 'PD-03', topicId: 'or3', difficulty: 3, type: 'single', prompt: 'Convert the bearing N 42°35\' W to an azimuth.', explanation: 'NW quadrant: Azimuth = 360° − 42°35\' = 317°25\'.', hint: 'NW bearings: Az = 360° minus the bearing angle.', citation: 'Metes & Bounds conventions', source: 'PropertyDesc', conceptIds: ['cor3a'], choices: [{ id: 'pd03a', choiceKey: 'A', text: '42°35\'', isCorrect: false }, { id: 'pd03b', choiceKey: 'B', text: '222°35\'', isCorrect: false }, { id: 'pd03c', choiceKey: 'C', text: '317°25\'', isCorrect: true }, { id: 'pd03d', choiceKey: 'D', text: '137°25\'', isCorrect: false }] },
  { id: 'PD-04', topicId: 'or3', difficulty: 3, type: 'single', prompt: 'When a legal description has conflicting calls, courts generally prioritize which type of evidence highest?', explanation: 'The standard hierarchy is: (1) natural monuments, (2) artificial monuments, (3) adjoiners/boundaries of record, (4) courses and distances, (5) area.', hint: 'Think physical evidence on the ground.', citation: 'Oregon boundary law hierarchy', source: 'PropertyDesc', conceptIds: ['cor3a'], choices: [{ id: 'pd04a', choiceKey: 'A', text: 'Area (acreage)', isCorrect: false }, { id: 'pd04b', choiceKey: 'B', text: 'Courses and distances', isCorrect: false }, { id: 'pd04c', choiceKey: 'C', text: 'Natural monuments', isCorrect: true }, { id: 'pd04d', choiceKey: 'D', text: 'The tax assessor\'s map', isCorrect: false }] },
  { id: 'PD-05', topicId: 'or3', difficulty: 2, type: 'single', prompt: 'A 19th-century deed calls for "150 rods to the large oak." How many feet is 150 rods?', explanation: '1 rod = 16.5 ft. 150 × 16.5 = 2,475 ft. (Also: 150 rods ÷ 4 = 37.5 chains.)', hint: '1 rod = 16.5 feet.', citation: 'Historic measurement units', source: 'PropertyDesc', conceptIds: ['cor3a'], choices: [{ id: 'pd05a', choiceKey: 'A', text: '1,500 ft', isCorrect: false }, { id: 'pd05b', choiceKey: 'B', text: '2,475 ft', isCorrect: true }, { id: 'pd05c', choiceKey: 'C', text: '2,250 ft', isCorrect: false }, { id: 'pd05d', choiceKey: 'D', text: '990 ft', isCorrect: false }] },
  { id: 'PD-06', topicId: 'or3', difficulty: 3, type: 'single', prompt: 'Oregon and Washington differ on curve labeling in legal descriptions. Which curve element does Oregon typically require that is not always required elsewhere?', explanation: 'Oregon requires delta (central angle), radius, arc length, chord bearing, and chord distance. The full set ensures the curve is fully defined on the plat.', hint: 'Think about the minimum curve data per ORS 92.050(8).', citation: 'ORS 92.050(8)', source: 'PropertyDesc', conceptIds: ['cor3b'], choices: [{ id: 'pd06a', choiceKey: 'A', text: 'Only the radius and arc length', isCorrect: false }, { id: 'pd06b', choiceKey: 'B', text: 'Delta, radius, arc length, chord bearing, and chord distance', isCorrect: true }, { id: 'pd06c', choiceKey: 'C', text: 'Only the tangent length', isCorrect: false }, { id: 'pd06d', choiceKey: 'D', text: 'Curve data is never required in Oregon', isCorrect: false }] },
  // ── Oregon Item 4: Unwritten Transfers (20%) ──────────────────
  { id: 'UT-01', topicId: 'or4', difficulty: 3, type: 'single', prompt: 'Under ORS 105.620, what standard of belief must an adverse possession claimant satisfy for the entire 10-year period?', explanation: 'ORS 105.620 requires an "honest belief" of ownership with an objective basis throughout the 10-year statutory period.', hint: 'Oregon added this requirement in 2009.', citation: 'ORS 105.620(1)(b)', source: 'UnwrittenTransfers', conceptIds: ['cor4a'], choices: [{ id: 'ut01a', choiceKey: 'A', text: 'Mere occupation without any belief', isCorrect: false }, { id: 'ut01b', choiceKey: 'B', text: 'Honest belief of ownership with an objective basis', isCorrect: true }, { id: 'ut01c', choiceKey: 'C', text: 'Knowledge that the land belongs to someone else', isCorrect: false }, { id: 'ut01d', choiceKey: 'D', text: 'Good faith purchase from a title company', isCorrect: false }] },
  { id: 'UT-02', topicId: 'or4', difficulty: 3, type: 'single', prompt: 'What is the statutory period for adverse possession in Oregon?', explanation: 'ORS 105.620 requires continuous possession for 10 years under the required conditions.', hint: 'A round number, less than 20.', citation: 'ORS 105.620(1)(a)', source: 'UnwrittenTransfers', conceptIds: ['cor4a'], choices: [{ id: 'ut02a', choiceKey: 'A', text: '5 years', isCorrect: false }, { id: 'ut02b', choiceKey: 'B', text: '7 years', isCorrect: false }, { id: 'ut02c', choiceKey: 'C', text: '10 years', isCorrect: true }, { id: 'ut02d', choiceKey: 'D', text: '20 years', isCorrect: false }] },
  { id: 'UT-03', topicId: 'or4', difficulty: 3, type: 'single', prompt: 'Under ORS 105.620(2)(a), what is the difference between "color of title" and "claim of right"?', explanation: 'Color of title means a written instrument (deed) that appears to convey title but is defective. Claim of right is possession under belief of ownership without any written instrument.', hint: 'One has a (flawed) document; the other does not.', citation: 'ORS 105.620(2)(a)', source: 'UnwrittenTransfers', conceptIds: ['cor4a'], choices: [{ id: 'ut03a', choiceKey: 'A', text: 'They are identical legal concepts', isCorrect: false }, { id: 'ut03b', choiceKey: 'B', text: 'Color of title requires a defective written instrument; claim of right does not require any document', isCorrect: true }, { id: 'ut03c', choiceKey: 'C', text: 'Color of title applies only to government land', isCorrect: false }, { id: 'ut03d', choiceKey: 'D', text: 'Claim of right requires a survey; color of title does not', isCorrect: false }] },
  { id: 'UT-04', topicId: 'or4', difficulty: 3, type: 'single', prompt: 'When accretion gradually adds land to a riparian parcel, who typically owns the new land?', explanation: 'Gradual accretion belongs to the upland (riparian) owner. The boundary follows the moving ordinary high water mark.', hint: 'Gradual vs. sudden — different rules apply.', citation: 'ORS 274.025; common law accretion', source: 'UnwrittenTransfers', conceptIds: ['cor4c'], choices: [{ id: 'ut04a', choiceKey: 'A', text: 'The state retains ownership of all new land', isCorrect: false }, { id: 'ut04b', choiceKey: 'B', text: 'The upland (riparian) owner', isCorrect: true }, { id: 'ut04c', choiceKey: 'C', text: 'The county surveyor', isCorrect: false }, { id: 'ut04d', choiceKey: 'D', text: 'Whoever files a claim first', isCorrect: false }] },
  { id: 'UT-05', topicId: 'or4', difficulty: 3, type: 'single', prompt: 'How does avulsion differ from accretion in its effect on property boundaries?', explanation: 'Avulsion is a sudden change (flood, earthquake). Unlike accretion, boundaries do NOT follow the sudden change — the boundary remains at the pre-event location.', hint: 'Sudden vs. gradual — which one moves the boundary?', citation: 'Common law avulsion doctrine', source: 'UnwrittenTransfers', conceptIds: ['cor4c'], choices: [{ id: 'ut05a', choiceKey: 'A', text: 'Boundaries immediately follow the new water line', isCorrect: false }, { id: 'ut05b', choiceKey: 'B', text: 'Boundaries remain at the pre-event location after a sudden change', isCorrect: true }, { id: 'ut05c', choiceKey: 'C', text: 'Avulsion and accretion have identical boundary effects', isCorrect: false }, { id: 'ut05d', choiceKey: 'D', text: 'Avulsion only applies to ocean coastlines', isCorrect: false }] },
  { id: 'UT-06', topicId: 'or4', difficulty: 2, type: 'single', prompt: 'On the Oregon PLS exam, if a case law question appears, where will you typically find the court\'s decision?', explanation: 'Case law questions present a 1–2 page court decision. The holding (answer) is almost always in the LAST paragraph.', hint: 'Read the last paragraph first.', citation: 'Exam strategy — Item 4', source: 'UnwrittenTransfers', conceptIds: ['cor4d'], choices: [{ id: 'ut06a', choiceKey: 'A', text: 'The first sentence of the document', isCorrect: false }, { id: 'ut06b', choiceKey: 'B', text: 'The last paragraph of the court decision', isCorrect: true }, { id: 'ut06c', choiceKey: 'C', text: 'A footnote at the bottom', isCorrect: false }, { id: 'ut06d', choiceKey: 'D', text: 'It will be highlighted in bold', isCorrect: false }] },
  // ── Oregon Item 5: Datums, GPS & OCRS (20%) ───────────────────
  { id: 'DG-01', topicId: 'or5', difficulty: 2, type: 'single', prompt: 'What is the primary advantage of Oregon\'s low-distortion OCRS projections over legacy State Plane?', explanation: 'OCRS zones are scaled to regional terrain heights so grid distances closely match ground distances, minimizing the grid-to-ground correction.', hint: 'Think about what causes grid vs. ground differences.', citation: 'ODOT OCRS page; SB 877 (2011)', source: 'DatumsGPS', conceptIds: ['cor5a'], choices: [{ id: 'dg01a', choiceKey: 'A', text: 'OCRS uses a different ellipsoid than NAD 83', isCorrect: false }, { id: 'dg01b', choiceKey: 'B', text: 'Grid distances closely match ground distances at regional elevations', isCorrect: true }, { id: 'dg01c', choiceKey: 'C', text: 'OCRS eliminates the need for GPS', isCorrect: false }, { id: 'dg01d', choiceKey: 'D', text: 'OCRS only works at sea level', isCorrect: false }] },
  { id: 'DG-02', topicId: 'or5', difficulty: 3, type: 'single', prompt: 'Senate Bill 877 (2011) authorized what change regarding coordinate systems in Oregon?', explanation: 'SB 877 allows OCRS to be used wherever State Plane coordinates were previously required by law, giving OCRS legal equivalence.', hint: 'A legislative authorization, not a technical change.', citation: 'SB 877 (2011); OAR 660-060', source: 'DatumsGPS', conceptIds: ['cor5a'], choices: [{ id: 'dg02a', choiceKey: 'A', text: 'Abolished the use of all coordinate systems', isCorrect: false }, { id: 'dg02b', choiceKey: 'B', text: 'Authorized OCRS wherever State Plane was previously required', isCorrect: true }, { id: 'dg02c', choiceKey: 'C', text: 'Required all surveys to use WGS 84', isCorrect: false }, { id: 'dg02d', choiceKey: 'D', text: 'Eliminated the need for survey monuments', isCorrect: false }] },
  { id: 'DG-03', topicId: 'or5', difficulty: 2, type: 'single', prompt: 'NAD 83 is a _______ datum; NAVD 88 is a _______ datum.', explanation: 'NAD 83 defines horizontal positions (latitude/longitude). NAVD 88 defines vertical positions (elevations/orthometric heights).', hint: 'One is for plan position, the other for height.', citation: 'NGS datum definitions', source: 'DatumsGPS', conceptIds: ['cor5b'], choices: [{ id: 'dg03a', choiceKey: 'A', text: 'vertical; horizontal', isCorrect: false }, { id: 'dg03b', choiceKey: 'B', text: 'horizontal; vertical', isCorrect: true }, { id: 'dg03c', choiceKey: 'C', text: 'tidal; geodetic', isCorrect: false }, { id: 'dg03d', choiceKey: 'D', text: 'local; global', isCorrect: false }] },
  { id: 'DG-04', topicId: 'or5', difficulty: 3, type: 'single', prompt: 'What is the role of a geoid model (e.g., GEOID18) in GPS surveying?', explanation: 'GPS gives ellipsoidal heights. A geoid model converts ellipsoidal heights to orthometric (mean sea level) heights by providing the geoid-ellipsoid separation (N value).', hint: 'GPS measures height above the ellipsoid, not sea level.', citation: 'NGS GEOID18; BLM Manual Ch. 4', source: 'DatumsGPS', conceptIds: ['cor5b'], choices: [{ id: 'dg04a', choiceKey: 'A', text: 'It converts horizontal coordinates between datums', isCorrect: false }, { id: 'dg04b', choiceKey: 'B', text: 'It converts ellipsoidal heights to orthometric heights', isCorrect: true }, { id: 'dg04c', choiceKey: 'C', text: 'It eliminates multipath error', isCorrect: false }, { id: 'dg04d', choiceKey: 'D', text: 'It determines the magnetic declination', isCorrect: false }] },
  { id: 'DG-05', topicId: 'or5', difficulty: 3, type: 'single', prompt: 'The Oregon Real-time GPS Network (ORGN) provides what service to surveyors?', explanation: 'ORGN is a network of permanent GNSS base stations across Oregon that provides real-time corrections for RTK surveying, eliminating the need for a surveyor\'s own base station.', hint: 'Think about what eliminates the need for your own base.', citation: 'ODOT ORGN; OCRS Toolkit', source: 'DatumsGPS', conceptIds: ['cor5c'], choices: [{ id: 'dg05a', choiceKey: 'A', text: 'Post-processed static positions only', isCorrect: false }, { id: 'dg05b', choiceKey: 'B', text: 'Real-time GNSS corrections from permanent base stations', isCorrect: true }, { id: 'dg05c', choiceKey: 'C', text: 'Automatic legal description generation', isCorrect: false }, { id: 'dg05d', choiceKey: 'D', text: 'Boundary adjudication services', isCorrect: false }] },
  { id: 'DG-06', topicId: 'or5', difficulty: 3, type: 'single', prompt: 'When field-checking OCRS residual scale factors, what two measurement methods would you compare?', explanation: 'Compare a GNSS baseline distance (grid) against a total station ground measurement. The difference reveals the grid-to-ground scale factor for that location.', hint: 'One gives grid distance; the other gives ground distance.', citation: 'ODOT OCRS grid-to-ground guidance', source: 'DatumsGPS', conceptIds: ['cor5a', 'cor5c'], choices: [{ id: 'dg06a', choiceKey: 'A', text: 'Two different GPS receivers at the same point', isCorrect: false }, { id: 'dg06b', choiceKey: 'B', text: 'GNSS baseline (grid) vs. total station (ground)', isCorrect: true }, { id: 'dg06c', choiceKey: 'C', text: 'Compass bearing vs. magnetic declination', isCorrect: false }, { id: 'dg06d', choiceKey: 'D', text: 'Two different geoid models', isCorrect: false }] },

  { id: 'MATH-201', topicId: 't1', difficulty: 2, type: 'single', prompt: 'Convert 47°15\'30" to decimal degrees.', explanation: '47 + 15/60 + 30/3600 = 47 + 0.25 + 0.00833 = 47.2583°.', hint: 'Minutes ÷ 60, seconds ÷ 3600.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c17'], choices: [{ id: 'ma201a', choiceKey: 'A', text: '47.2583°', isCorrect: true }, { id: 'ma201b', choiceKey: 'B', text: '47.1530°', isCorrect: false }, { id: 'ma201c', choiceKey: 'C', text: '47.3083°', isCorrect: false }, { id: 'ma201d', choiceKey: 'D', text: '47.2250°', isCorrect: false }] },
  { id: 'MATH-202', topicId: 't1', difficulty: 3, type: 'single', prompt: 'A triangle has sides a=150, b=200, c=250. What is the area using Heron\'s formula?', explanation: 's=(150+200+250)/2=300. A=√(300×150×100×50)=√(225,000,000)=15,000 sq units.', hint: 'First find s = half-perimeter.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c9','c16'], choices: [{ id: 'ma202a', choiceKey: 'A', text: '12,500 sq units', isCorrect: false }, { id: 'ma202b', choiceKey: 'B', text: '15,000 sq units', isCorrect: true }, { id: 'ma202c', choiceKey: 'C', text: '18,750 sq units', isCorrect: false }, { id: 'ma202d', choiceKey: 'D', text: '20,000 sq units', isCorrect: false }] },
  { id: 'MATH-203', topicId: 't1', difficulty: 2, type: 'single', prompt: 'What is the bearing of a line with azimuth 225°?', explanation: '225° is in the SW quadrant (180-270). Bearing = 225-180 = S 45° W.', hint: 'SW quadrant: subtract 180.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c2','c19'], choices: [{ id: 'ma203a', choiceKey: 'A', text: 'N 45° W', isCorrect: false }, { id: 'ma203b', choiceKey: 'B', text: 'S 45° W', isCorrect: true }, { id: 'ma203c', choiceKey: 'C', text: 'S 45° E', isCorrect: false }, { id: 'ma203d', choiceKey: 'D', text: 'N 45° E', isCorrect: false }] },
  { id: 'MATH-204', topicId: 't1', difficulty: 3, type: 'single', prompt: 'Using the Law of Cosines, find side c if a=100, b=80, angle C=60°.', explanation: 'c²=100²+80²−2(100)(80)cos60°=10000+6400−16000(0.5)=16400−8000=8400. c=√8400≈91.65.', hint: 'cos(60°) = 0.5.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c8'], choices: [{ id: 'ma204a', choiceKey: 'A', text: '91.65', isCorrect: true }, { id: 'ma204b', choiceKey: 'B', text: '86.60', isCorrect: false }, { id: 'ma204c', choiceKey: 'C', text: '100.00', isCorrect: false }, { id: 'ma204d', choiceKey: 'D', text: '78.10', isCorrect: false }] },
  { id: 'MATH-205', topicId: 't1', difficulty: 4, type: 'single', prompt: 'Using the Law of Sines, what is angle B if a=120, A=40°, b=150?', explanation: 'sinB/150 = sin40°/120. sinB = 150×sin40°/120 = 150×0.6428/120 = 0.8035. B = arcsin(0.8035) ≈ 53.5°.', hint: 'Set up sinB/b = sinA/a.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c1'], choices: [{ id: 'ma205a', choiceKey: 'A', text: '53.5°', isCorrect: true }, { id: 'ma205b', choiceKey: 'B', text: '50.0°', isCorrect: false }, { id: 'ma205c', choiceKey: 'C', text: '60.2°', isCorrect: false }, { id: 'ma205d', choiceKey: 'D', text: '45.8°', isCorrect: false }] },
  { id: 'MATH-206', topicId: 't1', difficulty: 2, type: 'single', prompt: 'What is the azimuth of a bearing N 72° E?', explanation: 'NE quadrant: azimuth equals the bearing angle. Azimuth = 72°.', hint: 'NE quadrant is the simplest conversion.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c2','c19'], choices: [{ id: 'ma206a', choiceKey: 'A', text: '72°', isCorrect: true }, { id: 'ma206b', choiceKey: 'B', text: '108°', isCorrect: false }, { id: 'ma206c', choiceKey: 'C', text: '288°', isCorrect: false }, { id: 'ma206d', choiceKey: 'D', text: '342°', isCorrect: false }] },
  { id: 'T-201', topicId: 't2', difficulty: 3, type: 'single', prompt: 'A traverse course has a bearing S 30° E and distance 400 ft. What is the latitude (N/S component)?', explanation: 'Latitude = dist × cos(bearing) = 400 × cos30° = 400 × 0.866 = 346.4 ft South (negative).', hint: 'Latitude = distance × cosine of bearing angle.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c11'], choices: [{ id: 't201a', choiceKey: 'A', text: '-346.4 ft', isCorrect: true }, { id: 't201b', choiceKey: 'B', text: '+346.4 ft', isCorrect: false }, { id: 't201c', choiceKey: 'C', text: '-200.0 ft', isCorrect: false }, { id: 't201d', choiceKey: 'D', text: '+200.0 ft', isCorrect: false }] },
  { id: 'T-202', topicId: 't2', difficulty: 3, type: 'single', prompt: 'The closure error of a traverse is 0.15 ft over a total perimeter of 1,500 ft. What is the relative precision?', explanation: 'Relative precision = closure/perimeter = 0.15/1500 = 1/10,000.', hint: 'Divide closure by total distance, express as a ratio.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c18','c20'], choices: [{ id: 't202a', choiceKey: 'A', text: '1:10,000', isCorrect: true }, { id: 't202b', choiceKey: 'B', text: '1:15,000', isCorrect: false }, { id: 't202c', choiceKey: 'C', text: '1:5,000', isCorrect: false }, { id: 't202d', choiceKey: 'D', text: '1:1,500', isCorrect: false }] },
  { id: 'T-203', topicId: 't2', difficulty: 4, type: 'single', prompt: 'In the Compass Rule adjustment, how is the latitude correction for a course calculated?', explanation: 'Compass Rule: correction = −(closure × course length / total perimeter). Proportional to course length.', hint: 'The correction is proportional to the length of each course.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c3'], choices: [{ id: 't203a', choiceKey: 'A', text: 'Closure × (course length / total perimeter)', isCorrect: true }, { id: 't203b', choiceKey: 'B', text: 'Closure × (course latitude / total latitude)', isCorrect: false }, { id: 't203c', choiceKey: 'C', text: 'Closure / number of courses', isCorrect: false }, { id: 't203d', choiceKey: 'D', text: 'Closure × (course departure / total departure)', isCorrect: false }] },
  { id: 'T-204', topicId: 't2', difficulty: 2, type: 'single', prompt: 'The departure (E/W component) of a course with bearing N 45° E and distance 200 ft is:', explanation: 'Departure = dist × sin(bearing) = 200 × sin45° = 200 × 0.7071 = 141.4 ft East.', hint: 'Departure = distance × sine of bearing angle.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c11'], choices: [{ id: 't204a', choiceKey: 'A', text: '+141.4 ft', isCorrect: true }, { id: 't204b', choiceKey: 'B', text: '-141.4 ft', isCorrect: false }, { id: 't204c', choiceKey: 'C', text: '+100.0 ft', isCorrect: false }, { id: 't204d', choiceKey: 'D', text: '+173.2 ft', isCorrect: false }] },
  { id: 'ERR-201', topicId: 't3', difficulty: 3, type: 'single', prompt: 'If the standard deviation of a single measurement is ±0.02 ft, what is the standard deviation of the mean of 16 measurements?', explanation: 'σ_mean = σ/√n = 0.02/√16 = 0.02/4 = ±0.005 ft.', hint: 'Divide by the square root of the number of measurements.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c6'], choices: [{ id: 'er201a', choiceKey: 'A', text: '±0.005 ft', isCorrect: true }, { id: 'er201b', choiceKey: 'B', text: '±0.010 ft', isCorrect: false }, { id: 'er201c', choiceKey: 'C', text: '±0.001 ft', isCorrect: false }, { id: 'er201d', choiceKey: 'D', text: '±0.020 ft', isCorrect: false }] },
  { id: 'ERR-202', topicId: 't3', difficulty: 3, type: 'single', prompt: 'The combined correction for curvature and refraction (in feet) at a distance of 1 mile is approximately:', explanation: 'C&R ≈ 0.574M² where M is distance in miles. 0.574×1² = 0.574 ft ≈ 0.57 ft.', hint: 'The formula is 0.574M² where M is in miles.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c13'], choices: [{ id: 'er202a', choiceKey: 'A', text: '0.57 ft', isCorrect: true }, { id: 'er202b', choiceKey: 'B', text: '0.07 ft', isCorrect: false }, { id: 'er202c', choiceKey: 'C', text: '1.14 ft', isCorrect: false }, { id: 'er202d', choiceKey: 'D', text: '2.30 ft', isCorrect: false }] },
  { id: 'ERR-203', topicId: 't3', difficulty: 2, type: 'single', prompt: 'Which type of error is eliminated by taking equal numbers of foresight and backsight readings?', explanation: 'Collimation error (line-of-sight not parallel to the telescope axis) cancels when BS and FS distances are equal.', hint: 'Think about balancing sight distances in leveling.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c21'], choices: [{ id: 'er203a', choiceKey: 'A', text: 'Collimation error', isCorrect: true }, { id: 'er203b', choiceKey: 'B', text: 'Personal reading error', isCorrect: false }, { id: 'er203c', choiceKey: 'C', text: 'Settlement error', isCorrect: false }, { id: 'er203d', choiceKey: 'D', text: 'Temperature error', isCorrect: false }] },
  { id: 'ERR-204', topicId: 't3', difficulty: 2, type: 'single', prompt: 'A systematic error is one that:', explanation: 'Systematic errors follow a pattern and can be corrected by applying formulas, calibration, or field procedures. They accumulate in one direction.', hint: 'Think constant bias, not random scatter.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c21'], choices: [{ id: 'er204a', choiceKey: 'A', text: 'Follows a pattern and can be corrected by a mathematical model', isCorrect: true }, { id: 'er204b', choiceKey: 'B', text: 'Is equally likely to be positive or negative', isCorrect: false }, { id: 'er204c', choiceKey: 'C', text: 'Cannot be reduced by repeated observations', isCorrect: false }, { id: 'er204d', choiceKey: 'D', text: 'Cancels out over many measurements', isCorrect: false }] },
  { id: 'ERR-205', topicId: 't3', difficulty: 4, type: 'single', prompt: 'Two distances are measured: 500.00 ± 0.03 ft and 300.00 ± 0.02 ft. The error of the sum is:', explanation: 'Propagation of random errors in addition: σ_sum = √(0.03² + 0.02²) = √(0.0009+0.0004) = √0.0013 = ±0.036 ft.', hint: 'Square root of sum of squares for independent errors.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c12'], choices: [{ id: 'er205a', choiceKey: 'A', text: '±0.036 ft', isCorrect: true }, { id: 'er205b', choiceKey: 'B', text: '±0.050 ft', isCorrect: false }, { id: 'er205c', choiceKey: 'C', text: '±0.025 ft', isCorrect: false }, { id: 'er205d', choiceKey: 'D', text: '±0.005 ft', isCorrect: false }] },
  { id: 'BL-201', topicId: 't4', difficulty: 3, type: 'single', prompt: 'In a conflict between a monument and a measured distance, which controls?', explanation: 'The hierarchy of calls places natural monuments first, then artificial monuments, then adjoiners, then courses and distances, then area. Monuments control over distances.', hint: 'Think about the hierarchy of calls in boundary law.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps','or'], conceptIds: ['c23'], choices: [{ id: 'bl201a', choiceKey: 'A', text: 'The monument', isCorrect: true }, { id: 'bl201b', choiceKey: 'B', text: 'The measured distance', isCorrect: false }, { id: 'bl201c', choiceKey: 'C', text: 'Whichever was recorded first', isCorrect: false }, { id: 'bl201d', choiceKey: 'D', text: 'The surveyor decides', isCorrect: false }] },
  { id: 'BL-202', topicId: 't4', difficulty: 3, type: 'single', prompt: 'What does "senior rights" mean in boundary law?', explanation: 'The first (older) conveyance is the "senior" deed. Senior rights take priority over junior (later) conveyances when there is a conflict or overlap.', hint: 'First in time is first in right.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c14'], choices: [{ id: 'bl202a', choiceKey: 'A', text: 'The earlier conveyance takes priority over later ones', isCorrect: true }, { id: 'bl202b', choiceKey: 'B', text: 'The larger parcel always takes priority', isCorrect: false }, { id: 'bl202c', choiceKey: 'C', text: 'The conveyance with the most monuments takes priority', isCorrect: false }, { id: 'bl202d', choiceKey: 'D', text: 'The most recent survey controls', isCorrect: false }] },
  { id: 'BL-203', topicId: 't4', difficulty: 2, type: 'multi', prompt: 'Which are elements of the OCEAN acronym for adverse possession? Select all.', explanation: 'OCEAN: Open, Continuous, Exclusive, Adverse/hostile, Notorious. All five must be met for the statutory period.', hint: 'Five letters, five requirements.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps','or'], conceptIds: ['c4'], choices: [{ id: 'bl203a', choiceKey: 'A', text: 'Open and Notorious', isCorrect: true }, { id: 'bl203b', choiceKey: 'B', text: 'Continuous', isCorrect: true }, { id: 'bl203c', choiceKey: 'C', text: 'Consensual', isCorrect: false }, { id: 'bl203d', choiceKey: 'D', text: 'Exclusive', isCorrect: true }] },
  { id: 'BL-204', topicId: 't4', difficulty: 3, type: 'single', prompt: 'In the hierarchy of calls, which has the LOWEST priority?', explanation: 'Hierarchy: natural monuments > artificial monuments > adjoiners > course & distance > area. Area (quantity) has the lowest priority.', hint: 'What is usually the most unreliable element of a description?', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps','or'], conceptIds: ['c23'], choices: [{ id: 'bl204a', choiceKey: 'A', text: 'Area (quantity of land)', isCorrect: true }, { id: 'bl204b', choiceKey: 'B', text: 'Natural monuments', isCorrect: false }, { id: 'bl204c', choiceKey: 'C', text: 'Bearings and distances', isCorrect: false }, { id: 'bl204d', choiceKey: 'D', text: 'Adjoiners (calls for adjoining owners)', isCorrect: false }] },
  { id: 'PLSS-201', topicId: 't5', difficulty: 2, type: 'single', prompt: 'In the PLSS, sections are numbered starting in which corner of a township?', explanation: 'Section 1 is in the NE corner, numbering goes west to 6, drops south, snakes east to 12, etc.', hint: 'Start northeast, snake westward.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps','or'], conceptIds: ['c7'], choices: [{ id: 'pl201a', choiceKey: 'A', text: 'Northeast', isCorrect: true }, { id: 'pl201b', choiceKey: 'B', text: 'Northwest', isCorrect: false }, { id: 'pl201c', choiceKey: 'C', text: 'Southeast', isCorrect: false }, { id: 'pl201d', choiceKey: 'D', text: 'Southwest', isCorrect: false }] },
  { id: 'PLSS-202', topicId: 't5', difficulty: 3, type: 'single', prompt: 'A meander line establishes:', explanation: 'Meander lines are NOT boundaries. They are survey lines run to approximate the sinuosities of a bank or shoreline. The actual boundary is the water body itself (OHWM).', hint: 'The boundary follows water, not the surveyed line.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps','or'], conceptIds: ['c5'], choices: [{ id: 'pl202a', choiceKey: 'A', text: 'The approximate location of a water boundary for area computation', isCorrect: true }, { id: 'pl202b', choiceKey: 'B', text: 'A fixed legal boundary along a waterway', isCorrect: false }, { id: 'pl202c', choiceKey: 'C', text: 'The high-water mark permanently', isCorrect: false }, { id: 'pl202d', choiceKey: 'D', text: 'A riparian rights boundary', isCorrect: false }] },
  { id: 'PLSS-203', topicId: 't5', difficulty: 4, type: 'single', prompt: 'Single proportionate measure is used to restore a corner on a line between two existing corners. Double proportion is used when:', explanation: 'Double proportion is used at the intersection of two lines (e.g., section corners at interior positions) where control exists in four directions.', hint: 'Think about corners at the intersection of two survey lines.', citation: 'BLM Manual 2009', source: 'Gen-FS-PS', examIds: ['fs','ps','or'], conceptIds: ['c15'], choices: [{ id: 'pl203a', choiceKey: 'A', text: 'The corner is at the intersection of two lines with control in four directions', isCorrect: true }, { id: 'pl203b', choiceKey: 'B', text: 'Two corners on the same line are missing', isCorrect: false }, { id: 'pl203c', choiceKey: 'C', text: 'The corner is a meander corner', isCorrect: false }, { id: 'pl203d', choiceKey: 'D', text: 'Only one original corner remains in the township', isCorrect: false }] },
  { id: 'PLSS-204', topicId: 't5', difficulty: 2, type: 'single', prompt: 'How many acres are in a standard section?', explanation: 'A standard section is 1 mile × 1 mile = 640 acres.', hint: 'One square mile.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps','or'], conceptIds: ['c24'], choices: [{ id: 'pl204a', choiceKey: 'A', text: '640', isCorrect: true }, { id: 'pl204b', choiceKey: 'B', text: '320', isCorrect: false }, { id: 'pl204c', choiceKey: 'C', text: '160', isCorrect: false }, { id: 'pl204d', choiceKey: 'D', text: '1,280', isCorrect: false }] },
  { id: 'PLSS-205', topicId: 't5', difficulty: 3, type: 'single', prompt: 'The NE¼ of the SW¼ of Section 12 contains how many acres?', explanation: '¼ of a section = 160 acres. ¼ of ¼ = 40 acres.', hint: 'Each quarter division cuts the acreage by 4.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps','or'], conceptIds: ['c24'], choices: [{ id: 'pl205a', choiceKey: 'A', text: '40 acres', isCorrect: true }, { id: 'pl205b', choiceKey: 'B', text: '80 acres', isCorrect: false }, { id: 'pl205c', choiceKey: 'C', text: '160 acres', isCorrect: false }, { id: 'pl205d', choiceKey: 'D', text: '20 acres', isCorrect: false }] },
  { id: 'GEO-201', topicId: 't7', difficulty: 3, type: 'single', prompt: 'NAD83 is a:', explanation: 'NAD83 (North American Datum of 1983) is a horizontal geodetic datum based on the GRS-80 ellipsoid. It defines latitude and longitude for North America.', hint: 'It defines horizontal positions, not elevations.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c29'], choices: [{ id: 'ge201a', choiceKey: 'A', text: 'Horizontal geodetic datum', isCorrect: true }, { id: 'ge201b', choiceKey: 'B', text: 'Vertical geodetic datum', isCorrect: false }, { id: 'ge201c', choiceKey: 'C', text: 'Tidal datum', isCorrect: false }, { id: 'ge201d', choiceKey: 'D', text: 'Magnetic datum', isCorrect: false }] },
  { id: 'GEO-202', topicId: 't7', difficulty: 3, type: 'single', prompt: 'NAVD88 elevations are referenced to:', explanation: 'NAVD88 (North American Vertical Datum of 1988) is based on a single tidal benchmark at Father Point/Rimouski, Quebec, Canada.', hint: 'Single tidal benchmark in Canada.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c29'], choices: [{ id: 'ge202a', choiceKey: 'A', text: 'A single tidal benchmark at Father Point, Quebec', isCorrect: true }, { id: 'ge202b', choiceKey: 'B', text: 'Mean sea level averaged across 26 tide gauges', isCorrect: false }, { id: 'ge202c', choiceKey: 'C', text: 'The GRS-80 ellipsoid', isCorrect: false }, { id: 'ge202d', choiceKey: 'D', text: 'The WGS84 geoid', isCorrect: false }] },
  { id: 'GEO-203', topicId: 't7', difficulty: 4, type: 'single', prompt: 'State Plane Coordinate Systems use which two map projections?', explanation: 'SPCS uses Transverse Mercator (for states elongated N-S) and Lambert Conformal Conic (for states elongated E-W).', hint: 'One for north-south states, one for east-west states.', citation: null, source: 'Gen-FS-PS', examIds: ['fs','ps'], conceptIds: ['c30','c31'], choices: [{ id: 'ge203a', choiceKey: 'A', text: 'Transverse Mercator and Lambert Conformal Conic', isCorrect: true }, { id: 'ge203b', choiceKey: 'B', text: 'Mercator and Polar Stereographic', isCorrect: false }, { id: 'ge203c', choiceKey: 'C', text: 'UTM and Albers Equal Area', isCorrect: false }, { id: 'ge203d', choiceKey: 'D', text: 'Oblique Mercator and Sinusoidal', isCorrect: false }] },

  { id: 'FS-201', topicId: 't6', difficulty: 2, type: 'single', prompt: 'A total station measures:', explanation: 'A total station combines an electronic theodolite (angles) with an EDM (distances) to measure both horizontal/vertical angles and slope distances.', hint: 'It combines two instruments into one.', citation: null, source: 'Gen-FS', examIds: ['fs'], conceptIds: ['c27'], choices: [{ id: 'fs201a', choiceKey: 'A', text: 'Both angles and distances electronically', isCorrect: true }, { id: 'fs201b', choiceKey: 'B', text: 'Only horizontal angles', isCorrect: false }, { id: 'fs201c', choiceKey: 'C', text: 'Only distances', isCorrect: false }, { id: 'fs201d', choiceKey: 'D', text: 'Only elevations', isCorrect: false }] },
  { id: 'FS-202', topicId: 't6', difficulty: 3, type: 'single', prompt: 'PDOP in GPS surveying stands for:', explanation: 'PDOP = Position Dilution of Precision. It describes the geometric strength of satellite configuration. Lower PDOP = better geometry = better positions.', hint: 'It measures satellite geometry quality.', citation: null, source: 'Gen-FS', examIds: ['fs'], conceptIds: ['c26'], choices: [{ id: 'fs202a', choiceKey: 'A', text: 'Position Dilution of Precision', isCorrect: true }, { id: 'fs202b', choiceKey: 'B', text: 'Positional Data Output Protocol', isCorrect: false }, { id: 'fs202c', choiceKey: 'C', text: 'Point Distribution of Parameters', isCorrect: false }, { id: 'fs202d', choiceKey: 'D', text: 'Precision Determination of Position', isCorrect: false }] },
  { id: 'FS-203', topicId: 't6', difficulty: 3, type: 'single', prompt: 'In differential leveling, the elevation of a turning point is calculated as:', explanation: 'HI = known elev + BS. TP elev = HI − FS. So TP = (known elev + BS) − FS.', hint: 'Add backsight to get HI, subtract foresight for new elevation.', citation: null, source: 'Gen-FS', examIds: ['fs'], conceptIds: ['c28'], choices: [{ id: 'fs203a', choiceKey: 'A', text: 'HI minus foresight reading', isCorrect: true }, { id: 'fs203b', choiceKey: 'B', text: 'HI plus foresight reading', isCorrect: false }, { id: 'fs203c', choiceKey: 'C', text: 'Backsight minus foresight', isCorrect: false }, { id: 'fs203d', choiceKey: 'D', text: 'Foresight minus backsight', isCorrect: false }] },
  { id: 'FS-204', topicId: 't6', difficulty: 4, type: 'single', prompt: 'The minimum number of satellites needed for a 3D GPS position fix is:', explanation: 'Four satellites are needed: three to determine X, Y, Z coordinates and a fourth to solve for the receiver clock error.', hint: 'Three for position, one more for the clock.', citation: null, source: 'Gen-FS', examIds: ['fs'], conceptIds: ['c26'], choices: [{ id: 'fs204a', choiceKey: 'A', text: '4', isCorrect: true }, { id: 'fs204b', choiceKey: 'B', text: '3', isCorrect: false }, { id: 'fs204c', choiceKey: 'C', text: '5', isCorrect: false }, { id: 'fs204d', choiceKey: 'D', text: '6', isCorrect: false }] },
  { id: 'FS-205', topicId: 't6', difficulty: 2, type: 'single', prompt: 'The "face left" and "face right" procedure with a total station eliminates:', explanation: 'Observing on both faces averages out systematic instrument errors including collimation, trunnion axis tilt, and vertical index error.', hint: 'Two faces cancel instrument misalignment.', citation: null, source: 'Gen-FS', examIds: ['fs'], conceptIds: ['c27','c21'], choices: [{ id: 'fs205a', choiceKey: 'A', text: 'Systematic instrument errors (collimation, trunnion axis)', isCorrect: true }, { id: 'fs205b', choiceKey: 'B', text: 'Atmospheric refraction', isCorrect: false }, { id: 'fs205c', choiceKey: 'C', text: 'Centering errors', isCorrect: false }, { id: 'fs205d', choiceKey: 'D', text: 'Target height mistakes', isCorrect: false }] },

  { id: 'PS-201', topicId: 't8', difficulty: 3, type: 'single', prompt: 'What is the minimum positional tolerance for an ALTA/NSPS Land Title Survey?', explanation: 'The 2021 ALTA/NSPS Standards require a relative positional precision of 2 cm (0.07 ft) at the 95% confidence level.', hint: 'Think centimeters, not tenths of a foot.', citation: 'ALTA/NSPS 2021 Standards', source: 'Gen-PS', examIds: ['ps'], conceptIds: ['c32'], choices: [{ id: 'ps201a', choiceKey: 'A', text: '2 cm (0.07 ft) at 95% confidence', isCorrect: true }, { id: 'ps201b', choiceKey: 'B', text: '1 cm (0.03 ft) at 95% confidence', isCorrect: false }, { id: 'ps201c', choiceKey: 'C', text: '5 cm (0.16 ft) at 90% confidence', isCorrect: false }, { id: 'ps201d', choiceKey: 'D', text: '0.1 ft at 68% confidence', isCorrect: false }] },
  { id: 'PS-202', topicId: 't8', difficulty: 2, type: 'single', prompt: 'Table A items in an ALTA survey are:', explanation: 'Table A contains optional items that the client can request, such as flood zone determination, setback lines, or utility locations. They are NOT automatic.', hint: 'The client checks the ones they want.', citation: 'ALTA/NSPS 2021 Standards', source: 'Gen-PS', examIds: ['ps'], conceptIds: ['c32'], choices: [{ id: 'ps202a', choiceKey: 'A', text: 'Optional items selected by the client', isCorrect: true }, { id: 'ps202b', choiceKey: 'B', text: 'Mandatory requirements for all ALTA surveys', isCorrect: false }, { id: 'ps202c', choiceKey: 'C', text: 'Items the surveyor must decline', isCorrect: false }, { id: 'ps202d', choiceKey: 'D', text: 'Title company requirements only', isCorrect: false }] },
  { id: 'PS-203', topicId: 't8', difficulty: 3, type: 'single', prompt: 'When staking a building on a construction site, "cut" means:', explanation: 'Cut means the existing ground is above the planned grade — material must be removed. Fill means ground is below grade — material must be added.', hint: 'Removing material to reach grade.', citation: null, source: 'Gen-PS', examIds: ['ps'], conceptIds: ['c33'], choices: [{ id: 'ps203a', choiceKey: 'A', text: 'Existing ground is above grade; material must be removed', isCorrect: true }, { id: 'ps203b', choiceKey: 'B', text: 'Existing ground is below grade; material must be added', isCorrect: false }, { id: 'ps203c', choiceKey: 'C', text: 'The distance from the stake to the building corner', isCorrect: false }, { id: 'ps203d', choiceKey: 'D', text: 'An error in the computed elevation', isCorrect: false }] },
